<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提醒程式</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Microsoft JhengHei', sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #3b5bdb;
    font-size: 1.8rem;
    margin-bottom: 24px;
    letter-spacing: 2px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    max-width: 560px;
    margin: 0 auto 24px;
    box-shadow: 0 4px 20px rgba(59,91,219,0.1);
  }
  .card h2 { color: #3b5bdb; font-size: 1.1rem; margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
  input[type="text"], input[type="time"], select {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #dde2ff;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    margin-bottom: 14px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: #3b5bdb; }
  .days-row {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .day-btn {
    padding: 6px 12px;
    border: 2px solid #dde2ff;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    background: white;
    color: #555;
    transition: all .2s;
    user-select: none;
  }
  .day-btn.active {
    background: #3b5bdb;
    border-color: #3b5bdb;
    color: white;
    font-weight: bold;
  }
  .btn-add {
    width: 100%;
    padding: 12px;
    background: #3b5bdb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-add:hover { background: #2f4ab8; }
  #notif-bar {
    max-width: 560px;
    margin: 0 auto 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    display: none;
  }
  #notif-bar.warn { background: #fff3bf; color: #7c5e00; display: block; }
  #notif-bar.ok { background: #d3f9d8; color: #1a6b2a; display: block; }
  .reminder-list { max-width: 560px; margin: 0 auto; }
  .reminder-item {
    background: white;
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(59,91,219,0.08);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .reminder-item .time-badge {
    background: #eef0ff;
    color: #3b5bdb;
    font-size: 1.4rem;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 10px;
    white-space: nowrap;
    min-width: 80px;
    text-align: center;
  }
  .reminder-item .info { flex: 1; }
  .reminder-item .title { font-size: 1rem; font-weight: bold; color: #222; }
  .reminder-item .repeat { font-size: 0.82rem; color: #888; margin-top: 3px; }
  .toggle-btn {
    background: none;
    border: 2px solid #aaa;
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 0.85rem;
    color: #555;
    transition: all .2s;
  }
  .toggle-btn.on { border-color: #3b5bdb; color: #3b5bdb; }
  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.3rem;
    color: #ccc;
    transition: color .2s;
    padding: 4px;
  }
  .del-btn:hover { color: #e03131; }
  .clock-display {
    text-align: center;
    font-size: 2.4rem;
    font-weight: bold;
    color: #3b5bdb;
    margin-bottom: 4px;
  }
  .date-display {
    text-align: center;
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 0;
  }
  .empty { text-align: center; color: #aaa; padding: 30px 0; font-size: 0.95rem; }

  /* 提醒彈跳視窗 */
  #alert-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 999;
    justify-content: center;
    align-items: center;
  }
  #alert-overlay.show { display: flex; }
  #alert-box {
    background: white;
    border-radius: 20px;
    padding: 36px 40px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    animation: pop .3s ease;
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  #alert-box .bell { font-size: 3rem; margin-bottom: 12px; }
  #alert-box .alert-title { font-size: 1.3rem; font-weight: bold; color: #222; margin-bottom: 6px; }
  #alert-box .alert-time { font-size: 0.9rem; color: #888; margin-bottom: 20px; }
  #alert-close {
    padding: 10px 32px;
    background: #3b5bdb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
  }
  #alert-close:hover { background: #2f4ab8; }
</style>
</head>
<body>

<h1>⏰ 提醒程式</h1>

<div class="card">
  <div class="clock-display" id="clock">00:00:00</div>
  <div class="date-display" id="date-display"></div>
</div>

<div id="notif-bar"></div>

<div class="card">
  <h2>新增提醒</h2>
  <label>提醒名稱</label>
  <input type="text" id="inp-title" placeholder="例：喝水、開會、吃藥…">
  <label>提醒時間</label>
  <input type="time" id="inp-time">
  <label>重複方式</label>
  <select id="inp-repeat">
    <option value="daily">每天</option>
    <option value="weekday">週一至週五</option>
    <option value="weekend">週六、週日</option>
    <option value="custom">自訂（選擇星期）</option>
    <option value="once">只提醒一次</option>
  </select>
  <div class="days-row" id="days-row" style="display:none">
    <span class="day-btn" data-d="0">日</span>
    <span class="day-btn" data-d="1">一</span>
    <span class="day-btn" data-d="2">二</span>
    <span class="day-btn" data-d="3">三</span>
    <span class="day-btn" data-d="4">四</span>
    <span class="day-btn" data-d="5">五</span>
    <span class="day-btn" data-d="6">六</span>
  </div>
  <button class="btn-add" onclick="addReminder()">＋ 新增提醒</button>
</div>

<div class="reminder-list" id="reminder-list"></div>

<!-- 彈跳提醒視窗 -->
<div id="alert-overlay">
  <div id="alert-box">
    <div class="bell">🔔</div>
    <div class="alert-title" id="alert-title"></div>
    <div class="alert-time" id="alert-time"></div>
    <button id="alert-close" onclick="closeAlert()">知道了</button>
  </div>
</div>

<script>
const DAY_NAMES = ['日','一','二','三','四','五','六'];
let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
let firedToday = JSON.parse(localStorage.getItem('firedToday') || '{}');
let audioCtx = null;

// 請求瀏覽器通知權限
if (Notification.permission === 'default') {
  Notification.requestPermission().then(p => showNotifBar(p));
} else {
  showNotifBar(Notification.permission);
}

function showNotifBar(p) {
  const bar = document.getElementById('notif-bar');
  if (p === 'granted') {
    bar.className = 'ok';
    bar.textContent = '✅ 瀏覽器通知已開啟，即使切換到其他頁面也會收到提醒';
    setTimeout(() => bar.style.display='none', 4000);
  } else if (p === 'denied') {
    bar.className = 'warn';
    bar.textContent = '⚠️ 瀏覽器通知被封鎖，提醒仍會在此頁顯示，請勿關閉此頁面';
  }
}

// 時鐘
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  document.getElementById('date-display').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${DAY_NAMES[now.getDay()]}`;
  checkReminders(now, h, m, s);
}
setInterval(updateClock, 1000);
updateClock();

// 清除「今天已觸發」記錄（每天零時重置）
function resetFiredIfNewDay() {
  const today = new Date().toDateString();
  if (firedToday._date !== today) {
    firedToday = { _date: today };
    localStorage.setItem('firedToday', JSON.stringify(firedToday));
  }
}

function checkReminders(now, h, m, s) {
  resetFiredIfNewDay();
  if (s !== '00') return; // 只在整分鐘時觸發
  const hm = `${h}:${m}`;
  const dow = now.getDay();
  reminders.forEach(r => {
    if (!r.active) return;
    if (r.time !== hm) return;
    if (firedToday[r.id]) return;
    if (!shouldFire(r, dow)) return;
    firedToday[r.id] = true;
    localStorage.setItem('firedToday', JSON.stringify(firedToday));
    triggerAlert(r);
    if (r.repeat === 'once') {
      r.active = false;
      saveAndRender();
    }
  });
}

function shouldFire(r, dow) {
  if (r.repeat === 'daily') return true;
  if (r.repeat === 'weekday') return dow >= 1 && dow <= 5;
  if (r.repeat === 'weekend') return dow === 0 || dow === 6;
  if (r.repeat === 'once') return true;
  if (r.repeat === 'custom') return r.days && r.days.includes(dow);
  return false;
}

function triggerAlert(r) {
  playBeep();
  showAlertBox(r.title, r.time);
  if (Notification.permission === 'granted') {
    new Notification('⏰ ' + r.title, {
      body: `提醒時間：${r.time}`,
      icon: 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple/img/apple/64/23f0.png'
    });
  }
}

function playBeep() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const times = [0, 0.35, 0.7];
  times.forEach(t => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime + t);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.28);
    osc.start(audioCtx.currentTime + t);
    osc.stop(audioCtx.currentTime + t + 0.3);
  });
}

function showAlertBox(title, time) {
  document.getElementById('alert-title').textContent = title;
  document.getElementById('alert-time').textContent = `提醒時間：${time}`;
  document.getElementById('alert-overlay').classList.add('show');
}
function closeAlert() {
  document.getElementById('alert-overlay').classList.remove('show');
}

// 自訂星期選擇
document.getElementById('inp-repeat').addEventListener('change', function() {
  document.getElementById('days-row').style.display = this.value === 'custom' ? 'flex' : 'none';
});
document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => btn.classList.toggle('active'));
});

function addReminder() {
  const title = document.getElementById('inp-title').value.trim();
  const time = document.getElementById('inp-time').value;
  const repeat = document.getElementById('inp-repeat').value;
  if (!title) { alert('請輸入提醒名稱'); return; }
  if (!time) { alert('請選擇提醒時間'); return; }
  let days = [];
  if (repeat === 'custom') {
    document.querySelectorAll('.day-btn.active').forEach(b => days.push(Number(b.dataset.d)));
    if (days.length === 0) { alert('請至少選擇一個星期'); return; }
  }
  reminders.push({ id: Date.now(), title, time, repeat, days, active: true });
  saveAndRender();
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-time').value = '';
  document.getElementById('inp-repeat').value = 'daily';
  document.getElementById('days-row').style.display = 'none';
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
}

function repeatLabel(r) {
  if (r.repeat === 'daily') return '每天重複';
  if (r.repeat === 'weekday') return '週一 ～ 週五';
  if (r.repeat === 'weekend') return '週六、週日';
  if (r.repeat === 'once') return '只提醒一次';
  if (r.repeat === 'custom' && r.days) return '每週' + r.days.map(d => DAY_NAMES[d]).join('、');
  return '';
}

function saveAndRender() {
  localStorage.setItem('reminders', JSON.stringify(reminders));
  const list = document.getElementById('reminder-list');
  if (reminders.length === 0) {
    list.innerHTML = '<div class="empty">尚無提醒，請在上方新增</div>';
    return;
  }
  list.innerHTML = reminders.map(r => `
    <div class="reminder-item" id="ri-${r.id}">
      <div class="time-badge">${r.time}</div>
      <div class="info">
        <div class="title">${escHtml(r.title)}</div>
        <div class="repeat">${repeatLabel(r)}</div>
      </div>
      <button class="toggle-btn ${r.active?'on':''}" onclick="toggleReminder(${r.id})">
        ${r.active ? '開啟' : '暫停'}
      </button>
      <button class="del-btn" onclick="delReminder(${r.id})" title="刪除">✕</button>
    </div>
  `).join('');
}

function toggleReminder(id) {
  const r = reminders.find(x => x.id === id);
  if (r) { r.active = !r.active; saveAndRender(); }
}
function delReminder(id) {
  reminders = reminders.filter(x => x.id !== id);
  saveAndRender();
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

saveAndRender();
</script>
</body>
</html>
