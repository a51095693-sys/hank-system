<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B1D14">
<meta name="apple-mobile-web-app-title" content="央廚盤點">
<title>央廚盤點 - 食材與廠商</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<link rel="stylesheet" href="style.css?v=20261009d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
.sp-wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.sp-side{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;position:sticky;top:16px}
.sp-side .ttl{font-size:13px;font-weight:800;color:var(--text2);padding:12px 14px 6px}
.sp-nav{display:flex;flex-direction:column;padding:4px 6px 6px}
.sp-nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 10px;border:none;background:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;color:var(--text1);text-align:left;cursor:pointer}
.sp-nav button:hover{background:var(--surface2)}
.sp-nav button.on{background:#2B1D14;color:#fff}
.sp-nav .n{font-size:12px;font-weight:700;color:var(--text2);background:var(--surface2);border-radius:999px;padding:1px 8px;flex-shrink:0}
.sp-nav button.on .n{background:rgba(255,255,255,.15);color:#FFD98A}
.sp-add{border-top:1px solid var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sp-main{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;min-width:0}
.sp-mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sp-mhead h2{font-size:19px;font-weight:900;flex:1;min-width:0}
.sp-mhead .cnt{font-size:13px;color:var(--text2);font-weight:500;margin-left:6px}
#ingTable td:not(:first-child){white-space:nowrap}
.sp-tag{display:inline-block;font-size:11px;font-weight:700;color:#C24A16;background:#FFF0D1;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.sp-warn{color:var(--danger)}
.sup-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sup-days label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.sup-days label:has(input:checked){background:#FFF0D1;border-color:#F5C46A;color:#C24A16}
.sp-info{font-size:13px;color:var(--text2);margin:-6px 0 12px;display:flex;gap:6px 14px;flex-wrap:wrap}
.sp-info:empty{display:none}
.sup-rules{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;font-size:13px}
.sup-rules .r{border:1px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sup-rules .r b{font-size:14px}
.sup-rules .r div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sup-rules input{width:80px;height:34px}
.sup-rules select{height:34px;width:auto;flex:1;min-width:0}
.sp-info .off{color:#8A3D08;font-weight:700}
@media(max-width:900px){
  .sp-wrap{grid-template-columns:1fr}
  .sp-side{position:static}
  .sp-side .ttl{display:none}
  .sp-nav{flex-direction:row;overflow-x:auto;gap:6px;padding:8px}
  .sp-nav button{width:auto;white-space:nowrap;padding:8px 12px;background:var(--surface2)}
  .sp-add{flex-direction:row}
  .sp-add input{flex:1;min-width:0}
}
</style>
</head>
<body>
<div class="mob-header">
  <button class="mob-menu-btn" onclick="toggleMenu()">☰</button>
  <span class="mob-title">🥬 食材</span>
  <span></span>
</div>
<div class="mob-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><h2><img src="icon.svg" alt="" class="sb-logo">央廚盤點</h2><p>庫存管理</p></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-user" id="sb-user-area"><div class="uname" style="color:rgba(255,255,255,.4);font-size:12px;">載入中…</div></div>
  </aside>
  <main class="main">
    <div class="page-title">🥬 食材與廠商</div>
    <p style="font-size:13px;color:var(--text3);margin-top:-12px;margin-bottom:16px;">向廠商叫貨的食材。叫貨計算會依配方算出需要量，再補足到「預留量」。</p>

    <div class="sp-wrap">
      <aside class="sp-side">
        <div class="ttl">廠商</div>
        <nav class="sp-nav" id="spNav" aria-label="廠商"><span class="text-muted" style="padding:10px;font-size:13px;">載入中…</span></nav>
        <div class="sp-add">
          <input type="text" class="form-control" id="supName" placeholder="新廠商名稱" onkeydown="if(event.key==='Enter')addSupplier()">
          <button class="btn btn-primary btn-sm" id="supAddBtn" style="justify-content:center;" onclick="addSupplier()">＋ 新增廠商</button>
        </div>
      </aside>
      <section class="sp-main">
        <div class="sp-mhead">
          <h2 id="spTitle">—</h2>
          <input type="search" autocomplete="off" name="ing-search" class="form-control" id="searchInput" placeholder="🔍 搜尋全部食材…" style="width:auto;min-width:180px;" oninput="renderSplit()">
          <span id="spActs" class="flex gap-2"></span>
        </div>
        <div class="sp-info" id="spInfo"></div>
        <div class="table-wrap">
          <table>
            <thead id="ingHead"></thead>
            <tbody id="ingTable"><tr><td class="text-muted text-center" style="padding:24px;">載入中…</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<!-- 新增 / 編輯食材 -->
<div class="modal-bg" id="itemModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-title" id="itemTitle">＋ 新增食材</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div style="grid-column:1/-1;"><label class="form-label">食材名稱 *</label><input type="text" class="form-control" id="iName" placeholder="例如：醬油"></div>
      <div style="grid-column:1/-1;"><label class="form-label">廠商</label><input type="text" class="form-control" id="iSupplier" list="supList" placeholder="從名單選，或打新廠商" autocomplete="off"><datalist id="supList"></datalist></div>
      <div><label class="form-label">單位 *</label><input type="text" class="form-control" id="iUnit" placeholder="件、包、桶…" oninput="document.getElementById('iCattyUnit').textContent = this.value.trim() || '單位'"></div>
      <div><label class="form-label">規格</label><input type="text" class="form-control" id="iSpec" placeholder="例如：12瓶／箱"></div>
      <div style="grid-column:1/-1;"><label class="form-label">台斤換算（選填，配方要用台斤／兩時才需要）</label>
        <div class="flex gap-2 items-center"><span style="font-size:14px;white-space:nowrap;">1 <span id="iCattyUnit">單位</span> ＝</span>
          <input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="iCatty" placeholder="例如：18" style="width:120px;">
          <span style="font-size:14px;">台斤</span></div></div>
      <div><label class="form-label">預留量</label><input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="iSafety" placeholder="至少要留多少"></div>
      <div id="iStockWrap"><label class="form-label">目前庫存</label><input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="iStock" placeholder="0"></div>
      <label style="grid-column:1/-1;display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;background:var(--surface2);border-radius:8px;padding:10px 12px;">
        <input type="checkbox" id="iCountAs" style="margin-top:3px;cursor:pointer;">
        <span><strong>盤點時歸在成品</strong><br><span style="color:var(--text2);">跟成品一起中午、晚上盤，不放在一天一次的食材盤點（例：生鮮雞肉）</span></span>
      </label>
    </div>
    <div id="iErr" class="hidden" role="alert" style="font-size:13px;color:var(--danger);background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:8px 10px;margin:-6px 0 12px;"></div>
    <div class="flex gap-2">
      <button class="btn btn-primary w-full" id="itemSaveBtn" onclick="saveItem()">儲存</button>
      <button class="btn btn-outline" onclick="closeModal('itemModal')">取消</button>
    </div>
    <button type="button" class="del-link hidden" id="iDelBtn" onclick="closeModal('itemModal'); openDel(document.getElementById('iId').value)">🗑 刪除這個食材</button>
    <input type="hidden" id="iId">
  </div>
</div>

<!-- 廠商送貨設定 -->
<div class="modal-bg" id="supModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-title">🚚 送貨設定：<span id="supMName"></span></div>
    <label class="form-label">哪幾天有送貨（取消勾選＝休息）</label>
    <div class="sup-days" id="supDays"></div>
    <p style="font-size:12px;color:var(--text2);margin:6px 0 14px;">送貨日叫的量會撐到下一次送貨日。</p>
    <label class="form-label">要提前幾天叫</label>
    <div class="flex gap-2 items-center" style="margin-bottom:14px;font-size:14px;">
      <select class="form-control" id="supLead" style="width:auto;">
        <option value="1">今天叫，明天到</option><option value="2">今天叫，後天到</option><option value="3">提前 3 天叫</option><option value="4">提前 4 天叫</option>
      </select>
    </div>
    <label class="form-label">叫貨規則（選填）</label>
    <div class="sup-rules" id="supRules"></div>
    <label class="form-label">叫貨備註</label>
    <textarea class="form-control" id="supNote" rows="3" placeholder="例如：最低叫貨 3000 元、前一天晚上 9 點前叫" style="margin-bottom:16px;resize:vertical;"></textarea>
    <div class="flex gap-2">
      <button class="btn btn-primary w-full" id="supSaveBtn" onclick="saveSup()">儲存</button>
      <button class="btn btn-outline" onclick="closeModal('supModal')">取消</button>
    </div>
  </div>
</div>

<!-- 進貨 -->
<div class="modal-bg" id="inModal">
  <div class="modal" style="max-width:380px;">
    <div class="modal-title">📥 進貨：<span id="inName"></span></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">目前庫存 <strong id="inNow"></strong></p>
    <label class="form-label">這次進貨數量 *</label>
    <div class="flex gap-2 items-center" style="margin-bottom:12px;">
      <input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="inQty" placeholder="輸入數量" style="font-size:18px;">
      <span id="inUnit" style="font-size:14px;color:var(--text2);white-space:nowrap;"></span>
      <span id="inSubWrap" class="flex gap-2 items-center hidden">
        <span style="color:var(--text2);">＋</span>
        <input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="inSub" placeholder="0" style="font-size:18px;width:90px;">
        <span id="inSubUnit" style="font-size:14px;color:var(--text2);white-space:nowrap;"></span>
      </span>
    </div>
    <label class="form-label">備註</label>
    <input type="text" class="form-control" id="inNote" placeholder="例如：廠商名稱" style="margin-bottom:16px;">
    <div class="flex gap-2">
      <button class="btn btn-primary w-full" id="inSaveBtn" onclick="saveIn()">登記進貨</button>
      <button class="btn btn-outline" style="white-space:nowrap;" onclick="closeModal('inModal')">取消</button>
    </div>
    <input type="hidden" id="inId">
  </div>
</div>

<!-- 確認刪除 -->
<div class="modal-bg" id="delModal">
  <div class="modal" style="max-width:360px;">
    <div class="modal-title" style="color:var(--danger);">⚠️ 確認刪除</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:20px;" id="delMsg"></p>
    <div class="flex gap-2">
      <button class="btn btn-danger w-full" id="delConfirmBtn" onclick="confirmDelete()">確認刪除</button>
      <button class="btn btn-outline" onclick="closeModal('delModal')">取消</button>
    </div>
    <input type="hidden" id="delId">
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { getUserData, showToast, renderSidebar, loadStockItems, escHtml, qtyText, loadSuppliers, fmtQty, WEEKDAYS, offText } from "./app.js?v=20261009d";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, 'default');

window.toggleMenu = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); };
window.doSignOut = async () => { sessionStorage.clear(); await signOut(auth); window.location.href = 'index.html'; };
window.closeModal = (id) => document.getElementById(id).classList.remove('open');
['itemModal', 'inModal', 'delModal', 'supModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) closeModal(id); });
});

let _ud = null;
let _items = [];
let _sups = [];
const ings = () => _items.filter(i => i.kind === '食材');
const usedBy = (id) => _items.filter(i => i.recipe.some(r => r.id === id)).map(i => i.name);

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  _ud = await getUserData(db, user);
  if (_ud.role !== 'admin' && _ud.role !== 'manager') { window.location.href = 'inventory.html'; return; }
  renderSidebar(_ud, 'ingredient.html', auth);
  loadAll();
});

async function loadAll() {
  try { _items = await loadStockItems(db); _sups = await loadSuppliers(db, _items); }
  catch (e) { document.getElementById('ingTable').innerHTML = '<tr><td class="text-muted text-center" style="padding:24px;">載入失敗，請重新整理</td></tr>'; return; }
  renderSplit();
}

// ── 廠商名單 ──
const itemsOf = (name) => _items.filter(i => i.supplier === name);
window.addSupplier = async () => {
  const input = document.getElementById('supName');
  const name = input.value.trim();
  if (!name) { showToast('請輸入廠商名稱', 'error'); return; }
  if (_sups.some(sp => sp.name === name)) { showToast('已有這個廠商', 'error'); return; }
  const btn = document.getElementById('supAddBtn');
  btn.disabled = true;
  try {
    await addDoc(collection(db, 'suppliers'), { name, createdAt: serverTimestamp() });
    input.value = '';
    _sel = name;
    try { localStorage.setItem(SEL_KEY, name); } catch (e) {}
    showToast(`已新增廠商「${name}」`, 'success');
    loadAll();
  } catch (e) {
    showToast('新增失敗，請重試', 'error');
  } finally {
    btn.disabled = false;
  }
};

window.delSupplier = async (k) => {
  const sp = _sups[k];
  if (!sp) return;
  const n = itemsOf(sp.name).length;
  if (n) { showToast(`「${sp.name}」還有 ${n} 個品項，請先把品項改到其他廠商`, 'error'); return; }
  if (!confirm(`確定刪除廠商「${sp.name}」？`)) return;
  try {
    if (sp.id) await deleteDoc(doc(db, 'suppliers', sp.id));
    showToast('廠商已刪除', 'success');
    loadAll();
  } catch (e) {
    showToast('刪除失敗', 'error');
  }
};

// 叫貨規則摘要，例：「滷肉最少 5 箱、油蔥酥要搭配滷肉」
const ruleText = (sp) => Object.entries(sp.rules || {}).map(([id, r]) => {
  const it = _items.find(i => i.id === id);
  if (!it) return '';
  const w = _items.find(i => i.id === r.with);
  return [r.min > 0 ? `${it.name}最少 ${fmtQty(r.min)} ${it.unit}` : '', w ? `${it.name}要搭配${w.name}` : ''].filter(Boolean).join('、');
}).filter(Boolean).join('、');

// ── 廠商送貨設定 ──
let _supK = -1;
window.openSup = (k) => {
  const sp = _sups[k];
  if (!sp) return;
  _supK = k;
  document.getElementById('supMName').textContent = sp.name;
  document.getElementById('supDays').innerHTML = [...WEEKDAYS].map((d, i) =>
    `<label><input type="checkbox" value="${i}" ${sp.off.includes(i) ? '' : 'checked'}>${d}</label>`).join('');
  document.getElementById('supNote').value = sp.note;
  document.getElementById('supLead').value = String(sp.lead || 1);
  const list = mine(sp.name);
  document.getElementById('supRules').innerHTML = list.length ? list.map(i => {
    const r = sp.rules[i.id] || {};
    const others = list.filter(o => o.id !== i.id);
    return `<div class="r" data-id="${i.id}"><b>${escHtml(i.name)}</b>
      <div>最低一次叫 <input type="number" min="0" step="any" inputmode="decimal" class="form-control" data-min value="${r.min > 0 ? r.min : ''}" placeholder="不限"> ${escHtml(i.unit)}</div>
      ${others.length ? `<div>不能單獨叫，要搭配 <select class="form-control" data-with><option value="">（可以單獨叫）</option>${others.map(o => `<option value="${o.id}" ${r.with === o.id ? 'selected' : ''}>${escHtml(o.name)}</option>`).join('')}</select></div>` : ''}
    </div>`;
  }).join('') : '<span class="text-muted">這家廠商還沒有品項</span>';
  document.getElementById('supModal').classList.add('open');
};
window.saveSup = async () => {
  const sp = _sups[_supK];
  if (!sp) return;
  const off = [...document.querySelectorAll('#supDays input')].filter(x => !x.checked).map(x => Number(x.value));
  if (off.length === 7) { showToast('至少要有一天送貨', 'error'); return; }
  const note = document.getElementById('supNote').value.trim();
  const lead = Number(document.getElementById('supLead').value) || 1;
  const rules = {};
  document.querySelectorAll('#supRules .r').forEach(el => {
    const min = Math.max(0, parseFloat(el.querySelector('[data-min]').value) || 0);
    const w = el.querySelector('[data-with]')?.value || '';
    if (min > 0 || w) rules[el.dataset.id] = { min, with: w };
  });
  const btn = document.getElementById('supSaveBtn');
  btn.disabled = true;
  try {
    // 舊資料的廠商（只寫在品項上）還沒有文件，這時候補建
    if (sp.id) await updateDoc(doc(db, 'suppliers', sp.id), { off, note, rules, lead });
    else await addDoc(collection(db, 'suppliers'), { name: sp.name, off, note, rules, lead, createdAt: serverTimestamp() });
    closeModal('supModal');
    showToast(`「${sp.name}」送貨設定已儲存`, 'success');
    loadAll();
  } catch (e) {
    showToast('儲存失敗，請重試', 'error');
  } finally {
    btn.disabled = false;
  }
};

// ── 左右分割：左邊選廠商，右邊顯示該廠商的品項 ──
const NO_SUP = '未設定廠商';
const SEL_KEY = 'ing_sup';
let _sel = (() => { try { return localStorage.getItem(SEL_KEY) || ''; } catch (e) { return ''; } })();
// 每家廠商的品項：食材，加上外購的成品
const mine = (name) => _items.filter(i => (i.kind === '食材' || i.supplier) && (i.supplier || NO_SUP) === name);
const supNames = () => [
  ..._sups.map(sp => sp.name).sort((a, b) => mine(b).length - mine(a).length || a.localeCompare(b, 'zh-Hant')),
  ...(_items.some(i => i.kind === '食材' && !i.supplier) ? [NO_SUP] : [])
];

window.pickSup = (k) => {
  _sel = supNames()[k] || '';
  try { localStorage.setItem(SEL_KEY, _sel); } catch (e) {}
  document.getElementById('searchInput').value = '';
  renderSplit();
};

function rowHtml(i, withSup) {
  const isIng = i.kind === '食材';
  const used = isIng ? usedBy(i.id) : [];
  return `<tr>
    <td data-label="品名" style="font-weight:700;">${escHtml(i.name)}${isIng ? '' : '<span class="sp-tag">成品</span>'}</td>
    ${withSup ? `<td data-label="廠商" style="font-size:12px;color:var(--text2);">${escHtml(i.supplier || NO_SUP)}</td>` : ''}
    <td data-label="規格" style="font-size:12px;color:var(--text2);">${escHtml(i.spec) || '-'}${i.catty > 0 ? `<div>1 ${escHtml(i.unit)} = ${fmtQty(i.catty)} 台斤</div>` : ''}</td>
    <td data-label="預留量" style="color:var(--text2);">${i.safety > 0 ? escHtml(qtyText(i, i.safety)) : '-'}</td>
    <td data-label="目前庫存" style="font-weight:700;">${escHtml(qtyText(i, i.stock))}</td>
    <td data-label="用在" style="font-size:12px;color:var(--text2);white-space:normal;">${isIng ? (used.length ? escHtml(used.join('、')) : '<span class="sp-warn">還沒用在配方</span>') : '（直接出給店面）'}</td>
    <td><div class="flex gap-2">
      <button class="btn btn-sm btn-primary" onclick="openIn('${i.id}')">📥 進貨</button>
      ${isIng
        ? `<button class="btn btn-sm btn-outline" onclick="openItem('${i.id}')">編輯</button>`
        : '<a class="btn btn-sm btn-outline" href="stock.html" title="外購成品請到品項庫存編輯">編輯</a>'}
    </div></td>
  </tr>`;
}

window.renderSplit = () => {
  const names = supNames();
  if (!names.includes(_sel)) _sel = names[0] || '';
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();

  // 左：廠商清單
  document.getElementById('spNav').innerHTML = names.length ? names.map((n, k) =>
    `<button type="button" class="${!kw && n === _sel ? 'on' : ''}" aria-current="${!kw && n === _sel}" onclick="pickSup(${k})"><span>${escHtml(n)}</span><span class="n">${mine(n).length}</span></button>`
  ).join('') : '<span class="text-muted" style="padding:10px;font-size:13px;">還沒有廠商，先在下方新增</span>';

  // 右：選中廠商的品項，或全部食材的搜尋結果
  const head = (withSup) => `<tr><th>品名</th>${withSup ? '<th>廠商</th>' : ''}<th>規格</th><th>預留量</th><th>目前庫存</th><th>用在</th><th></th></tr>`;
  const title = document.getElementById('spTitle');
  const acts = document.getElementById('spActs');
  const tbody = document.getElementById('ingTable');
  document.getElementById('spInfo').innerHTML = '';
  if (kw) {
    const hits = _items.filter(i => (i.kind === '食材' || i.supplier) && `${i.name} ${i.spec} ${i.supplier}`.toLowerCase().includes(kw));
    title.innerHTML = `搜尋結果<span class="cnt">${hits.length} 項</span>`;
    acts.innerHTML = '';
    document.getElementById('ingHead').innerHTML = head(true);
    tbody.innerHTML = hits.length ? hits.map(i => rowHtml(i, true)).join('')
      : '<tr><td colspan="7" class="text-muted text-center" style="padding:24px;">沒有符合的食材</td></tr>';
    return;
  }
  if (!_sel) {
    title.textContent = '—';
    acts.innerHTML = '';
    document.getElementById('ingHead').innerHTML = '';
    tbody.innerHTML = '<tr><td class="text-muted text-center" style="padding:24px;">請先在左邊新增廠商</td></tr>';
    return;
  }
  const list = mine(_sel);
  const k = _sups.findIndex(sp => sp.name === _sel);
  title.innerHTML = `${escHtml(_sel)}<span class="cnt">${list.length} 項</span>`;
  const sp = _sups[k];
  document.getElementById('spInfo').innerHTML = sp
    ? `<span class="${sp.off.length ? 'off' : ''}">🚚 ${escHtml(offText(sp.off) || '每天送貨')}</span>${sp.lead > 1 ? `<span>⏱️ 要提前 ${sp.lead} 天叫</span>` : ''}${sp.note ? `<span>📝 ${escHtml(sp.note)}</span>` : ''}${ruleText(sp) ? `<span>📏 ${escHtml(ruleText(sp))}</span>` : ''}` : '';
  acts.innerHTML = (sp ? `<button class="btn btn-sm btn-outline" onclick="openSup(${k})">🚚 送貨設定</button>` : '') +
    `<button class="btn btn-primary btn-sm" onclick="openItem('', ${k})">＋ 新增食材</button>` +
    (k >= 0 && !list.length ? `<button class="btn btn-sm btn-outline" onclick="delSupplier(${k})">刪除這個廠商</button>` : '');
  document.getElementById('ingHead').innerHTML = head(false);
  tbody.innerHTML = list.length ? list.map(i => rowHtml(i, false)).join('')
    : '<tr><td colspan="6" class="text-muted text-center" style="padding:28px;">這家廠商還沒有品項，按右上「＋ 新增食材」建立</td></tr>';
};

// ── 新增／編輯 ──
window.openItem = (id, supIdx) => {
  const it = id ? _items.find(x => x.id === id) : null;
  document.getElementById('itemTitle').textContent = it ? '✏️ 編輯食材' : '＋ 新增食材';
  formErr('');
  document.getElementById('iId').value = it ? it.id : '';
  document.getElementById('iDelBtn').classList.toggle('hidden', !it);
  document.getElementById('iName').value = it ? it.name : '';
  // 從廠商卡片按「新增食材」時自動帶入該廠商
  document.getElementById('iSupplier').value = it ? it.supplier : (_sups[supIdx]?.name || '');
  // 已有的廠商列為選項，新增時打新名稱即可
  document.getElementById('supList').innerHTML = _sups.map(sp => `<option value="${escHtml(sp.name)}"></option>`).join('');
  document.getElementById('iUnit').value = it ? it.unit : '';
  document.getElementById('iSpec').value = it ? it.spec : '';
  document.getElementById('iCatty').value = it && it.catty > 0 ? it.catty : '';
  document.getElementById('iCattyUnit').textContent = it ? it.unit : '單位';
  document.getElementById('iSafety').value = it && it.safety > 0 ? it.safety : '';
  document.getElementById('iCountAs').checked = !!it?.countAs;
  document.getElementById('iStock').value = '';
  // 已建立的食材庫存由盤點或「進貨」更新，保留紀錄
  document.getElementById('iStockWrap').classList.toggle('hidden', !!it);
  document.getElementById('itemModal').classList.add('open');
};

function formErr(msg) {
  const el = document.getElementById('iErr');
  el.textContent = msg;
  el.classList.toggle('hidden', !msg);
}

window.saveItem = async () => {
  const id = document.getElementById('iId').value;
  const name = document.getElementById('iName').value.trim();
  const unit = document.getElementById('iUnit').value.trim();
  const supplier = document.getElementById('iSupplier').value.trim();
  if (!name) { formErr('請輸入食材名稱'); return; }
  if (!unit) { formErr('請輸入單位'); return; }
  // 不同廠商可以有同名品項；同一家廠商內不能重複
  if (_items.some(x => x.id !== id && x.name === name && x.supplier === supplier)) {
    formErr(`「${supplier || '未設定廠商'}」已經有「${name}」了，請換一個名稱`); return;
  }
  formErr('');
  const data = {
    name, unit,
    supplier,
    catty: Math.max(0, parseFloat(document.getElementById('iCatty').value) || 0),
    spec: document.getElementById('iSpec').value.trim(),
    safety: Math.max(0, parseFloat(document.getElementById('iSafety').value) || 0),
    countAs: document.getElementById('iCountAs').checked ? '成品' : ''
  };
  const btn = document.getElementById('itemSaveBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    if (id) {
      await updateDoc(doc(db, 'stockItems', id), data);
      showToast('食材已更新', 'success');
    } else {
      const stock = Math.max(0, parseFloat(document.getElementById('iStock').value) || 0);
      await addDoc(collection(db, 'stockItems'), {
        ...data, kind: '食材', category: '', recipe: [], stock, sort: _items.length, createdAt: serverTimestamp()
      });
      showToast(`食材「${name}」已新增`, 'success');
    }
    closeModal('itemModal');
    loadAll();
  } catch (e) {
    showToast('儲存失敗，請重試', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '儲存';
  }
};

// ── 進貨 ──
window.openIn = (id) => {
  const it = _items.find(x => x.id === id);
  if (!it) return;
  document.getElementById('inId').value = id;
  document.getElementById('inName').textContent = it.name;
  document.getElementById('inNow').textContent = qtyText(it, it.stock);
  document.getElementById('inUnit').textContent = it.unit;
  document.getElementById('inSubUnit').textContent = it.sub || '';
  document.getElementById('inSubWrap').classList.toggle('hidden', !it.per);
  ['inQty', 'inSub', 'inNote'].forEach(x => { document.getElementById(x).value = ''; });
  document.getElementById('inModal').classList.add('open');
};

window.saveIn = async () => {
  const it = _items.find(x => x.id === document.getElementById('inId').value);
  if (!it) return;
  const big = parseFloat(document.getElementById('inQty').value) || 0;
  const sub = it.per ? (parseFloat(document.getElementById('inSub').value) || 0) : 0;
  const qty = big + (it.per ? sub / it.per : 0);
  if (!(qty > 0)) { showToast('請輸入大於 0 的數量', 'error'); return; }
  const after = Math.round((it.stock + qty) * 10000) / 10000;
  const btn = document.getElementById('inSaveBtn');
  btn.disabled = true; btn.textContent = '登記中…';
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, 'stockItems', it.id), { stock: after });
    batch.set(doc(collection(db, 'stockMoves')), {
      itemId: it.id, itemName: it.name, unit: it.unit, type: '進貨',
      qty, before: it.stock, after,
      note: document.getElementById('inNote').value.trim(),
      by: _ud.name, at: serverTimestamp()
    });
    await batch.commit();
    showToast(`${it.name} +${qtyText(it, qty)}`, 'success');
    closeModal('inModal');
    loadAll();
  } catch (e) {
    showToast('登記失敗，請重試', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '登記進貨';
  }
};

// ── 刪除 ──
window.openDel = (id) => {
  const it = _items.find(x => x.id === id);
  if (!it) return;
  const used = usedBy(id);
  document.getElementById('delId').value = id;
  document.getElementById('delMsg').innerHTML = `確定要刪除食材 <strong>${escHtml(it.name)}</strong> 嗎？過去的盤點與異動紀錄會保留。` +
    (used.length ? `<br><br><span style="color:var(--danger);">這個食材正用在：${escHtml(used.join('、'))}，刪除後這些配方會少算這項材料。</span>` : '');
  document.getElementById('delModal').classList.add('open');
};

window.confirmDelete = async () => {
  const id = document.getElementById('delId').value;
  const btn = document.getElementById('delConfirmBtn');
  btn.disabled = true;
  try {
    // 一併從用到它的配方中移除，避免配方指向不存在的品項
    const batch = writeBatch(db);
    batch.delete(doc(db, 'stockItems', id));
    _items.filter(i => i.recipe.some(r => r.id === id)).forEach(i => {
      batch.update(doc(db, 'stockItems', i.id), { recipe: i.recipe.filter(r => r.id !== id) });
    });
    await batch.commit();
    showToast('食材已刪除', 'success');
    closeModal('delModal');
    loadAll();
  } catch (e) {
    showToast('刪除失敗', 'error');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
