<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>央廚盤點 - 配方設定</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
.rc{max-width:1120px}
.rc-sec{font-size:15px;font-weight:800;color:var(--text2);margin:18px 4px 10px}
.rc-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:1000px){.rc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rc-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rc-card.dirty{border-color:#3FBF7F;box-shadow:0 0 0 2px rgba(63,191,127,.25)}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc-head h3{font-size:18px;font-weight:900}
.rc-head .per{font-size:13px;color:var(--text2);margin-top:2px}
.rc-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.rc-tag.none{background:#FDF1E6;color:#8A3D08}
.rc-tag.ok{background:#E3F2EA;color:#1E6B47}
.rc-line{display:flex;align-items:center;gap:8px}
.rc-line select{flex:1;min-width:0;height:44px}
.rc-line input{width:96px;height:44px;font-size:16px}
.rc-line .u{font-size:13px;color:var(--text2);min-width:40px}
.rc-empty{font-size:13px;color:var(--text3)}
.rc-used{font-size:12px;color:var(--text2)}
.rc-foot{display:flex;gap:8px;margin-top:2px}
.rc-foot .btn{height:40px}
</style>
</head>
<body>
<div class="mob-header">
  <button class="mob-menu-btn" onclick="toggleMenu()">☰</button>
  <span class="mob-title">🧪 配方設定</span>
  <span></span>
</div>
<div class="mob-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><h2>📦 央廚盤點</h2><p>庫存管理</p></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-user" id="sb-user-area"><div class="uname" style="color:rgba(255,255,255,.4);font-size:12px;">載入中…</div></div>
  </aside>
  <main class="main">
    <div class="rc">
      <div class="page-title">🧪 配方設定</div>
      <p style="font-size:13px;color:var(--text3);margin-top:-12px;margin-bottom:8px;">設定每 1 單位成品、半成品要用多少材料。叫貨計算會依配方一層層推算要做多少、要叫多少食材。</p>
      <div id="rcBody"><div class="text-muted">載入中…</div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { getUserData, showToast, renderSidebar, loadStockItems, escHtml, qtyText, recipeCycle } from "./app.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, 'default');

window.toggleMenu = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); };
window.doSignOut = async () => { sessionStorage.clear(); await signOut(auth); window.location.href = 'index.html'; };

let _ud = null;
let _items = [];
// 編輯中的配方 {品項id: [{ id, qty }]}，與已儲存的不同時卡片標示為未儲存
let _edit = {};
const byId = (id) => _items.find(i => i.id === id);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  _ud = await getUserData(db, user);
  if (_ud.role !== 'admin' && _ud.role !== 'manager') { window.location.href = 'inventory.html'; return; }
  renderSidebar(_ud, 'recipe.html', auth);
  loadAll();
});

// 離開頁面前提醒還沒儲存的配方
window.addEventListener('beforeunload', e => {
  if (_items.some(i => isDirty(i))) { e.preventDefault(); e.returnValue = ''; }
});

async function loadAll() {
  try { _items = await loadStockItems(db); }
  catch (e) { document.getElementById('rcBody').innerHTML = '<div class="card text-muted text-center">載入失敗，請重新整理</div>'; return; }
  _edit = {};
  _items.forEach(i => { _edit[i.id] = i.recipe.map(r => ({ ...r })); });
  render();
}

const cleanRecipe = (rows) => rows.filter(r => r.id && Number(r.qty) > 0).map(r => ({ id: r.id, qty: Number(r.qty) }));
const isDirty = (it) => _edit[it.id] && !same(_edit[it.id].map(r => ({ id: r.id, qty: Number(r.qty) || 0 })), it.recipe);

function usedBy(id) {
  return _items.filter(i => i.recipe.some(r => r.id === id)).map(i => i.name);
}

function card(it) {
  const rows = _edit[it.id];
  const opts = _items.filter(x => x.id !== it.id && x.kind !== '成品');
  const used = usedBy(it.id);
  const lines = rows.length ? rows.map((r, i) => {
    const c = byId(r.id);
    return `<div class="rc-line">
      <select class="form-control" aria-label="${escHtml(it.name)} 材料 ${i + 1}" onchange="setLine('${it.id}', ${i}, 'id', this.value)">
        <option value="">選擇材料</option>
        <optgroup label="半成品">${opts.filter(o => o.kind === '半成品').map(o => `<option value="${o.id}" ${o.id === r.id ? 'selected' : ''}>${escHtml(o.name)}</option>`).join('')}</optgroup>
        <optgroup label="食材">${opts.filter(o => o.kind === '食材').map(o => `<option value="${o.id}" ${o.id === r.id ? 'selected' : ''}>${escHtml(o.name)}</option>`).join('')}</optgroup>
      </select>
      <input type="number" min="0" step="any" inputmode="decimal" class="form-control" aria-label="${escHtml(it.name)} 材料 ${i + 1} 數量" placeholder="數量" value="${r.qty || ''}" oninput="setLine('${it.id}', ${i}, 'qty', this.value)">
      <span class="u">${c ? escHtml(c.unit) : ''}</span>
      <button type="button" class="btn btn-sm btn-outline" aria-label="移除" onclick="removeLine('${it.id}', ${i})">✕</button>
    </div>`;
  }).join('') : '<div class="rc-empty">尚未設定材料</div>';
  const dirty = isDirty(it);
  return `<div class="rc-card${dirty ? ' dirty' : ''}" id="card-${it.id}">
    <div class="rc-head">
      <div><h3>${escHtml(it.name)}</h3><div class="per">每 1 ${escHtml(it.unit)} 需要</div></div>
      ${it.recipe.length ? `<span class="rc-tag ok">已設定 ${it.recipe.length} 項</span>` : '<span class="rc-tag none">尚未設定</span>'}
    </div>
    ${lines}
    ${used.length ? `<div class="rc-used">用在：${escHtml(used.join('、'))}</div>` : ''}
    <div class="rc-foot">
      <button type="button" class="btn btn-outline btn-sm" onclick="addLine('${it.id}')">＋ 加入材料</button>
      <span style="flex:1;"></span>
      ${dirty ? `<button type="button" class="btn btn-outline btn-sm" onclick="resetCard('${it.id}')">還原</button>` : ''}
      <button type="button" class="btn btn-primary btn-sm" id="save-${it.id}" onclick="saveCard('${it.id}')" ${dirty ? '' : 'disabled'}>儲存</button>
    </div>
  </div>`;
}

function render() {
  const groups = [['成品', '成品（店面叫貨的品項）'], ['半成品', '半成品（央廚自製）']];
  const html = groups.map(([k, label]) => {
    const list = _items.filter(i => i.kind === k);
    if (!list.length) return '';
    return `<div class="rc-sec">${label}</div><div class="rc-grid">${list.map(card).join('')}</div>`;
  }).join('');
  const hasMaterial = _items.some(i => i.kind !== '成品');
  document.getElementById('rcBody').innerHTML = (html || '<div class="card text-muted text-center">還沒有成品或半成品</div>') +
    (hasMaterial ? '' : '<div class="card text-muted" style="margin-top:12px;font-size:13px;">還沒有半成品或食材可以當材料，請先到「🥬 食材」新增食材。</div>');
}

function rerender(id) {
  const it = byId(id);
  const el = document.getElementById('card-' + id);
  if (it && el) el.outerHTML = card(it);
}

window.addLine = (id) => { _edit[id].push({ id: '', qty: '' }); rerender(id); };
window.removeLine = (id, i) => { _edit[id].splice(i, 1); rerender(id); };
window.resetCard = (id) => { _edit[id] = byId(id).recipe.map(r => ({ ...r })); rerender(id); };
window.setLine = (id, i, key, v) => {
  _edit[id][i][key] = v;
  if (key === 'id') { rerender(id); return; }
  // 輸入數量時不重繪整張卡片，避免游標跳掉；只更新未儲存狀態與按鈕
  const it = byId(id);
  const dirty = isDirty(it);
  document.getElementById('card-' + id)?.classList.toggle('dirty', dirty);
  const btn = document.getElementById('save-' + id);
  if (btn) btn.disabled = !dirty;
};

window.saveCard = async (id) => {
  const it = byId(id);
  const rows = _edit[id];
  if (rows.some(r => r.id && !(Number(r.qty) > 0))) { showToast('材料數量要大於 0', 'error'); return; }
  if (rows.some(r => !r.id && Number(r.qty) > 0)) { showToast('有數量但沒選材料', 'error'); return; }
  const recipe = cleanRecipe(rows);
  const ids = recipe.map(r => r.id);
  if (new Set(ids).size !== ids.length) { showToast('同一個材料重複了，請合併成一行', 'error'); return; }
  if (recipeCycle(_items, id, recipe)) { showToast('配方繞回自己了，請檢查材料', 'error'); return; }
  const btn = document.getElementById('save-' + id);
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    await updateDoc(doc(db, 'stockItems', id), { recipe });
    it.recipe = recipe;
    _edit[id] = recipe.map(r => ({ ...r }));
    showToast(`「${it.name}」配方已儲存`, 'success');
    render();
  } catch (e) {
    showToast('儲存失敗，請重試', 'error');
    btn.disabled = false; btn.textContent = '儲存';
  }
};
</script>
</body>
</html>
