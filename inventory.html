<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>央廚盤點 - 盤點</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 盤點頁配色依設計稿 */
.inv{--ink:#17201B;--mute:#56605A;--line:#E1E4DF;--bg:#F3F4F1;--green:#1E6B47;--green2:#3FBF7F;--warn:#8A3D08;--warnbg:#FDF1E6;--warnline:#F1D3B6;--okbg:#E3F2EA;
  max-width:1120px;font-family:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink)}
body{background:#F3F4F1}
/* 讓內容區不被分類按鈕列等寬內容撐開（手機版右側被切掉的原因） */
.main{min-width:0}
.inv-chips{max-width:100%;scrollbar-width:none}
.inv-chips::-webkit-scrollbar{display:none}
.inv svg{flex-shrink:0}
.inv-top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 4px 16px}
.inv-top .who{font-size:14px;color:var(--mute)}
.inv-top h1{font-size:30px;font-weight:900;letter-spacing:1px;line-height:1.2}
.inv-top .day{font-size:15px;font-weight:500;color:var(--mute)}
.inv-hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px}
.inv-hero .hrow{display:flex;justify-content:space-between;align-items:center}
.inv-hero .lab{font-size:14px;color:#C9D2CC}
.inv-hero .sub{font-size:15px;color:#C9D2CC}
.inv-hero .ttl{font-size:24px;font-weight:900}
.inv-pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.inv-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv-slot{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;font-family:inherit;text-align:left;cursor:pointer}
.inv-slot:hover{background:rgba(255,255,255,.08)}
.inv-slot.now{border-color:#3FBF7F;box-shadow:inset 0 0 0 1px #3FBF7F}
.inv-slot .nm{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:900}
.inv-slot .st{font-size:13px;color:#C9D2CC}
.inv-slot.done .st{color:#BFE8D0}
.inv-pill.todo{background:#F5C04A;color:#17201B}
.inv-pill.ok{background:#BFE8D0;color:#0E2A1C}
.inv-big{height:56px;border-radius:14px;border:none;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.inv-big.go{height:60px;font-size:20px;background:var(--green2);color:#0E2A1C}
.inv-big.primary{background:var(--green);color:#fff}
.inv-big.dark{background:var(--ink);color:#fff}
.inv-big.ghost{background:#fff;color:var(--ink);border:1px solid #C9CFC9;font-weight:700}
.inv-big:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.inv-link{background:none;border:none;color:#C9D2CC;font-family:inherit;font-size:13px;cursor:pointer;align-self:center;text-decoration:underline}
.inv-types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.inv-type{height:84px;border:1px solid var(--line);background:#fff;border-radius:16px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.inv-type:hover{border-color:var(--green)}
.inv-warn{background:var(--warnbg);border:1px solid var(--warnline);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.inv-warn h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--warn)}
.inv-warn .row{display:flex;justify-content:space-between;font-size:16px}
.inv-warn .row b{font-weight:700}
.inv-warn .row small{font-size:14px;font-weight:400;color:#6B4A2E}
.inv-sec{font-size:16px;font-weight:700;color:var(--mute);margin:4px 4px 8px}
.inv-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.inv-li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:none;border-top:1px solid var(--line);width:100%;background:#fff;font-family:inherit;text-align:left;color:inherit}
button.inv-li{cursor:pointer}
button.inv-li:hover{background:#FAFBF9}
.inv-li:first-child{border-top:none}
.inv-li .t{font-size:16px;font-weight:700}
.inv-li .m{font-size:13px;color:var(--mute);margin-top:2px}
.inv-tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.inv-tag.diff{color:var(--warn);background:var(--warnbg)}
.inv-tag.same{color:var(--green);background:var(--okbg)}
.inv-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inv-ico.ok{background:var(--okbg);color:var(--green)}
.inv-ico.warn{background:var(--warnbg);color:var(--warn)}
.inv-bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.inv-head{display:flex;align-items:center;gap:8px}
.inv-head h2{font-size:20px;font-weight:900}
.inv-head .hint{font-size:13px;color:var(--mute)}
.inv-back{width:44px;height:44px;border-radius:12px;border:none;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inv-back:hover{background:var(--bg)}
.inv-count{font-size:18px;font-weight:900;white-space:nowrap}
.inv-count small{font-size:14px;font-weight:500;color:var(--mute)}
.inv-prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.inv-prog>div{height:100%;background:var(--green2);border-radius:999px;transition:width .2s}
.inv-chips{display:flex;gap:8px;overflow-x:auto}
.inv-chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid #C9CFC9;background:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink)}
.inv-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.inv-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px;border-radius:16px;background:#fff;border:2px dashed #C9CFC9;margin-bottom:10px}
.inv-item.done{border:1px solid var(--line)}
.inv-item .info{flex:1 1 120px;min-width:0}
.inv-item .nm{font-size:19px;font-weight:900;display:flex;align-items:center;gap:6px}
.inv-item .sp{font-size:13px;color:var(--mute);margin-top:2px}
.inv-step{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
.inv-step button{width:48px;height:48px;border-radius:12px;font-size:26px;font-weight:700;cursor:pointer;font-family:inherit}
.inv-step .minus{background:#fff;border:1px solid #C9CFC9;color:var(--ink)}
.inv-step .plus{background:var(--green);border:none;color:#fff}
.inv-num{display:flex;flex-direction:column;align-items:center;gap:2px}
.inv-step input{width:72px;height:48px;text-align:center;font-size:22px;font-weight:900;border:1.5px solid #C9CFC9;border-radius:12px;font-family:inherit;background:#fff;color:var(--ink);padding:0 4px;-moz-appearance:textfield}
.inv-step input::-webkit-outer-spin-button,.inv-step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inv-step input::placeholder{color:#A8B0AA;font-weight:500;font-size:15px}
.inv-step input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(30,107,71,.15)}
.inv-step .pk input{width:60px}
.inv-step .plus-sign{font-size:18px;font-weight:700;color:var(--mute);padding:0 2px 16px}
.inv-unit{font-size:12px;color:var(--mute);text-align:center}
.inv-first{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.inv-first h3{font-size:16px;font-weight:700;margin-bottom:4px}
.inv-first p{font-size:13px;color:var(--mute);margin-bottom:8px}
.inv-first .list{font-size:15px;color:#3D4741;line-height:1.9}
.inv-foot{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:4px;display:flex;gap:10px}
.inv-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.inv-stats>div{border-radius:14px;padding:12px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.inv-stats .l{font-size:13px;color:var(--mute)}
.inv-stats .n{font-size:26px;font-weight:900}
.inv-stats .same{background:var(--okbg);border-color:var(--okbg)}
.inv-stats .same *{color:#1E5A3D}
.inv-stats .diff{background:var(--warnbg);border-color:var(--warnbg)}
.inv-stats .diff *{color:var(--warn)}
.inv-diff{background:#fff;border:1px solid var(--warnline);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.inv-diff .top{display:flex;justify-content:space-between;align-items:center}
.inv-diff .nm{font-size:20px;font-weight:900}
.inv-diff .delta{font-size:18px;font-weight:900;color:var(--warn);background:var(--warnbg);padding:4px 12px;border-radius:999px}
.inv-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv-cmp>div{background:var(--bg);border-radius:12px;padding:10px 12px}
.inv-cmp .l{font-size:13px;color:var(--mute)}
.inv-cmp .v{font-size:20px;font-weight:700}
.inv-reasons{display:flex;flex-wrap:wrap;gap:8px}
.inv-reason{height:44px;padding:0 14px;border-radius:12px;border:1px solid #C9CFC9;background:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.inv-reason.on{background:var(--ink);border-color:var(--ink);color:#fff}
.inv-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.inv-box summary{font-size:16px;font-weight:700;cursor:pointer}
.inv-done-ic{width:88px;height:88px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:24px auto 10px}
.inv-plan{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.inv-plan .lab{font-size:14px;color:#C9D2CC}
.inv-plan .row{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.inv-plan .row span:last-child{color:#C9D2CC;text-align:right}
.inv-plan b{color:#F5C04A}
.inv-plan .hd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#F5C04A}
.inv-plan table{width:100%;border-collapse:collapse;font-size:15px}
.inv-plan th{background:none;border:none;padding:4px 0 6px;font-size:12px;font-weight:500;color:#9AA59F;text-align:right;white-space:nowrap}
.inv-plan th:first-child,.inv-plan td:first-child{text-align:left}
.inv-plan td{border:none;border-top:1px solid rgba(255,255,255,.1);padding:8px 0;text-align:right;color:#C9D2CC;white-space:nowrap}
.inv-plan td:first-child{color:#fff;font-weight:700}
.inv-plan tr:hover td{background:none}
.inv-plan .inv-big{height:48px;font-size:16px;border-radius:12px;margin-top:4px}
#vDone{max-width:640px;margin:0 auto}
@media(min-width:1000px){
  .inv-home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
  .inv-top h1{font-size:34px}
  #cList,#dList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;align-items:start}
}
@media(max-width:768px){.inv{max-width:none}.inv-top{margin-top:0}.inv-bar{top:60px}}
</style>
</head>
<body>
<div class="mob-header">
  <button class="mob-menu-btn" onclick="toggleMenu()">☰</button>
  <span class="mob-title">📦 盤點</span>
  <span></span>
</div>
<div class="mob-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><h2>📦 央廚盤點</h2><p>庫存管理</p></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-user" id="sb-user-area"><div class="uname" style="color:rgba(255,255,255,.4);font-size:12px;">載入中…</div></div>
  </aside>
  <main class="main">
    <div class="inv">

    <!-- 1. 盤點首頁 -->
    <section id="vHome">
      <div class="inv-top">
        <div><div class="who" id="homeWho"></div><h1>盤點</h1></div>
        <div class="day" id="homeDay"></div>
      </div>
      <div id="homeBody"><div class="text-muted">載入中…</div></div>
    </section>

    <!-- 2. 逐項盤點 -->
    <section id="vCount" class="hidden">
      <div class="inv-bar">
        <div class="inv-head">
          <button class="inv-back" onclick="leaveCount()" aria-label="返回">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
          </button>
          <div style="flex:1;min-width:0;">
            <h2 id="cTitle"></h2>
            <div class="hint">盲盤模式 · 不顯示系統數量</div>
          </div>
          <div class="inv-count"><span id="cDone">0</span><small> / <span id="cTotal">0</span></small></div>
        </div>
        <div class="inv-prog"><div id="cBar" style="width:0%;"></div></div>
      </div>
      <div id="cList"></div>
      <div class="inv-foot">
        <button class="inv-big ghost" style="width:110px;font-size:17px;" onclick="saveDraft(true)">暫存</button>
        <button class="inv-big dark" id="cNextBtn" onclick="goDiff()">下一步：核對差異</button>
      </div>
    </section>

    <!-- 3. 核對差異 -->
    <section id="vDiff" class="hidden">
      <div class="inv-bar">
        <div class="inv-head">
          <button class="inv-back" onclick="show('vCount')" aria-label="返回盤點">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
          </button>
          <h2>核對差異</h2>
        </div>
      </div>
      <div class="inv-stats">
        <div><span class="l">已盤</span><span class="n" id="dTotal">0</span></div>
        <div class="same"><span class="l">相符</span><span class="n" id="dSame">0</span></div>
        <div class="diff"><span class="l">有差異</span><span class="n" id="dDiffN">0</span></div>
      </div>
      <div id="dHint" style="font-size:14px;color:var(--mute);margin:0 4px 12px;">差異原因可以不選，選了方便日後追查</div>
      <div id="dList"></div>
      <details class="inv-box" id="dSameBox">
        <summary>相符品項（<span id="dSame2">0</span>）</summary>
        <div id="dSameList" style="margin-top:10px;font-size:15px;color:#3D4741;line-height:1.9;"></div>
      </details>
      <div class="inv-foot">
        <button class="inv-big primary" id="dSubmitBtn" onclick="submitCount()">送出盤點</button>
      </div>
    </section>

    <!-- 4. 盤點完成 -->
    <section id="vDone" class="hidden">
      <div class="inv-done-ic">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      </div>
      <div style="text-align:center;font-size:28px;font-weight:900;">盤點完成</div>
      <div style="text-align:center;font-size:15px;color:var(--mute);margin:6px 0 18px;" id="doneMeta"></div>
      <div class="inv-list" id="doneList"></div>
      <div id="donePlan"></div>
      <div class="flex gap-2">
        <a href="stock.html" class="inv-big ghost" style="font-size:16px;">查看品項庫存</a>
        <button class="inv-big dark" style="font-size:16px;" onclick="backHome()">回首頁</button>
      </div>
    </section>

    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<!-- 盤點紀錄明細 -->
<div class="modal-bg" id="detailModal">
  <div class="modal" style="width:560px;">
    <div class="modal-title" id="detTitle"></div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px;" id="detMeta"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>品名</th><th>系統</th><th>實盤</th><th>差異</th><th>原因</th></tr></thead>
        <tbody id="detTable"></tbody>
      </table>
    </div>
    <div class="flex gap-2 mt-4"><button class="btn btn-outline w-full" onclick="closeDetail()">關閉</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, query, orderBy, limit, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { getUserData, showToast, renderSidebar, todayStr, loadStockItems, fmtQty, escHtml, splitBox, qtyText } from "./app.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, 'default');

window.toggleMenu = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); };
window.doSignOut = async () => { sessionStorage.clear(); await signOut(auth); window.location.href = 'index.html'; };
window.closeDetail = () => document.getElementById('detailModal').classList.remove('open');
document.getElementById('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') closeDetail(); });

const svg = (paths, size = 24, sw = 2, color = 'currentColor') =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const IC = {
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path>',
  house: '<path d="M4 20h16"></path><path d="M6 20V10l6-4 6 4v10"></path><path d="M10 20v-5h4v5"></path>',
  search: '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path>',
  warn: '<path d="M12 3l10 18H2L12 3z"></path><path d="M12 10v5"></path><path d="M12 18h.01"></path>',
  arrow: '<path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>',
  check: '<path d="M5 12l5 5 9-10"></path>',
  note: '<rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h4"></path>'
};
const CHECK_MARK = svg(IC.check, 18, 3, '#1E6B47');

const COUNT_TYPES = {
  '成品': { title: '成品盤點', ic: IC.box, kinds: ['成品'], partial: false },
  '原物料': { title: '原物料盤點', ic: IC.house, kinds: ['原物料'], partial: false },
  '抽盤': { title: '臨時抽盤', ic: IC.search, kinds: ['成品', '原物料'], partial: true }
};
const REASONS = ['報廢', '試吃／員工餐', '點錯／漏記', '其他'];
// 成品每天盤兩次；15:00 前算中午，之後算晚上
const SLOTS = ['中午', '晚上'];
const slotNow = () => new Date().getHours() < 15 ? '中午' : '晚上';
const countTitle = (c) => c.slot ? `${c.slot}盤點` : COUNT_TYPES[c.type].title;
const DRAFT_KEY = 'inv_draft';

let _ud = null;
let _items = [];
let _recent = [];
// 進行中的盤點：{ type, counts: {itemId: number}, reasons: {itemId: string}, cat }
let _cur = null;
let _rows = [];

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  _ud = await getUserData(db, user);
  if (_ud.role !== 'admin' && _ud.role !== 'manager') {
    alert('此帳號沒有盤點權限，請聯絡管理員');
    sessionStorage.clear(); await signOut(auth); window.location.href = 'index.html'; return;
  }
  renderSidebar(_ud, 'inventory.html', auth);
  loadHome();
});

window.show = (id) => {
  ['vHome', 'vCount', 'vDiff', 'vDone'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== id));
  window.scrollTo(0, 0);
};

function readDraft() {
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; }
}
window.saveDraft = (notify) => {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(_cur)); } catch (e) {}
  if (notify) showToast('已暫存，下次可接續盤點', 'success');
};
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

const isLow = (it) => it.safety > 0 && it.stock < it.safety;

// 與 loadStockItems 相同，另外帶出 counted（是否盤點過）
async function loadItems() {
  const [items, snap] = await Promise.all([loadStockItems(db), getDocs(collection(db, 'stockItems'))]);
  const counted = new Set(snap.docs.filter(d => d.data().lastCountAt).map(d => d.id));
  return items.map(i => ({ ...i, counted: counted.has(i.id) }));
}

const fmtAt = (ts) => ts?.toDate ? ts.toDate().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '';

// ── 1. 首頁 ──
async function loadHome() {
  show('vHome');
  const now = new Date();
  document.getElementById('homeWho').textContent = `華安央廚 · ${_ud.name}`;
  document.getElementById('homeDay').textContent = `${now.getMonth() + 1}/${now.getDate()}（${'日一二三四五六'[now.getDay()]}）`;
  const body = document.getElementById('homeBody');
  try {
    const [items, snap] = await Promise.all([
      loadItems(),
      getDocs(query(collection(db, 'stockCounts'), orderBy('at', 'desc'), limit(10)))
    ]);
    _items = items;
    _recent = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    body.innerHTML = '<div class="card text-muted text-center">載入失敗，請重新整理</div>';
    return;
  }

  if (!_items.length) {
    body.innerHTML = `<div class="card text-center" style="padding:28px;">
      <div style="font-size:15px;margin-bottom:12px;">還沒有任何品項，請先建立要盤點的品項</div>
      <a href="stock.html" class="btn btn-primary">前往品項庫存</a></div>`;
    return;
  }

  const today = todayStr();
  const draft = readDraft();
  const nFinished = _items.filter(i => i.kind === '成品').length;
  const doneOf = (s) => _recent.find(r => r.date === today && r.type === '成品' && r.slot === s);

  let html = '';
  const n = Object.keys(draft?.counts || {}).length;
  if (draft && COUNT_TYPES[draft.type] && n) {
    html += `<div class="inv-hero">
      <div class="hrow"><span class="lab">未完成的盤點</span><span class="inv-pill todo">進行中</span></div>
      <div class="ttl">${escHtml(countTitle(draft))}</div>
      <div class="sub">上次已盤 ${n} 項，可以接續完成</div>
      <button class="inv-big go" onclick="resumeDraft()">繼續盤點 ${svg(IC.arrow, 22, 2.5)}</button>
      <button class="inv-link" onclick="discardDraft()">放棄這次暫存</button>
    </div>`;
  } else {
    // 主按鈕：優先盤現在這個時段；已完成就改盤另一個未完成的時段
    const now = slotNow();
    const target = !doneOf(now) ? now : (SLOTS.find(s => !doneOf(s)) || now);
    const allDone = SLOTS.every(doneOf);
    html += `<div class="inv-hero">
      <div class="hrow"><span class="lab">今日任務 · ${nFinished} 個品項</span><span class="inv-pill ${allDone ? 'ok' : 'todo'}">${SLOTS.filter(doneOf).length} / 2 完成</span></div>
      <div class="inv-slots">${SLOTS.map(s => {
        const d = doneOf(s);
        return `<button class="inv-slot${d ? ' done' : ''}${s === target && !allDone ? ' now' : ''}" onclick="startCount('成品','${s}')" ${nFinished ? '' : 'disabled'}>
          <span class="nm">${d ? svg(IC.check, 18, 3, '#3FBF7F') : ''}${s}盤點</span>
          <span class="st">${d ? `${escHtml(d.by)} · ${fmtAt(d.at).slice(-5)} 完成` : '未完成'}</span>
        </button>`;
      }).join('')}</div>
      <button class="inv-big go" onclick="startCount('成品','${target}')" ${nFinished ? '' : 'disabled'}>${allDone ? `再盤一次（${target}）` : `開始${target}盤點`} ${svg(IC.arrow, 22, 2.5)}</button>
    </div>`;
  }

  // 沒有品項的盤點類型不顯示（例如尚未建立原物料）
  const types = Object.entries(COUNT_TYPES).filter(([, t]) => _items.some(i => t.kinds.includes(i.kind)));
  html += `<div class="inv-types" style="grid-template-columns:repeat(${types.length},minmax(0,1fr));">${types.map(([k, t]) =>
    `<button class="inv-type" onclick="startCount('${k}')">${svg(t.ic, 24, 2, '#1E6B47')}${t.title}</button>`).join('')}</div>`;

  html += `<div class="inv-sec">最近盤點</div>`;
  html += _recent.length
    ? `<div class="inv-list">${_recent.map(r => `<button class="inv-li" onclick="openDetail('${r.id}')">
        <div><div class="t">${escHtml(r.date.slice(5).replace('-', '/'))} ${escHtml(r.title)}</div><div class="m">${escHtml(r.by)} · ${fmtAt(r.at)} · ${r.total} 項</div></div>
        ${recentTag(r)}
      </button>`).join('')}</div>`
    : '<div class="inv-list"><div class="inv-li" style="color:var(--mute);justify-content:center;">尚無盤點紀錄</div></div>';

  body.innerHTML = `<div class="inv-home"><div>${html}</div><div>${planCard()}</div></div>`;
}

function recentTag(r) {
  if (r.diffCount) return `<span class="inv-tag diff">差異 ${r.diffCount} 項</span>`;
  if (r.firstCount) return `<span class="inv-tag same">首次建檔</span>`;
  return '<span class="inv-tag same">全部相符</span>';
}

// 庫存不足＋建議生產量合併成一張卡
function planCard() {
  const need = _items.filter(isLow);
  if (!need.length) {
    return `<div class="inv-plan"><div class="lab">庫存狀況</div><div class="row"><span>所有品項都在安全庫存以上</span></div></div>`;
  }
  return `<div class="inv-plan">
    <div class="hd">${svg(IC.warn, 20, 2.2)}庫存不足（${need.length} 項）</div>
    <table>
      <thead><tr><th>品名</th><th>目前</th><th>安全量</th><th>建議生產</th></tr></thead>
      <tbody>${need.map(i => `<tr>
        <td>${escHtml(i.name)}</td>
        <td>${escHtml(qtyText(i, i.stock))}</td>
        <td>${escHtml(qtyText(i, i.safety))}</td>
        <td><b>${escHtml(qtyText(i, i.safety - i.stock))}</b></td>
      </tr>`).join('')}</tbody>
    </table>
    <button class="inv-big go" onclick="copyPlan()">複製生產單</button>
  </div>`;
}

window.copyPlan = async () => {
  const now = new Date();
  const lines = _items.filter(isLow).map(i => `・${i.name}：${qtyText(i, i.safety - i.stock)}`);
  const text = `【生產單】${now.getMonth() + 1}/${now.getDate()}\n${lines.join('\n')}`;
  try {
    await navigator.clipboard.writeText(text);
    showToast('已複製，可以貼到 LINE', 'success');
  } catch (e) {
    showToast('複製失敗，請改用截圖', 'error');
  }
};

window.backHome = () => loadHome();

window.openDetail = (id) => {
  const r = _recent.find(x => x.id === id);
  if (!r) return;
  document.getElementById('detTitle').textContent = `${r.date} ${r.title}`;
  document.getElementById('detMeta').textContent = `${r.by}・${fmtAt(r.at)}・共 ${r.total} 項，差異 ${r.diffCount} 項`;
  document.getElementById('detTable').innerHTML = (r.items || []).map(x => {
    const u = _items.find(i => i.id === x.id) || x;
    const diffText = x.first ? '首次建檔' : (x.diff ? `${x.diff > 0 ? '+' : ''}${qtyText(u, x.diff)}` : '相符');
    return `<tr>
    <td data-label="品名" style="font-weight:700;">${escHtml(x.name)}</td>
    <td data-label="系統">${x.first ? '-' : escHtml(qtyText(u, x.system))}</td>
    <td data-label="實盤">${escHtml(qtyText(u, x.counted))}</td>
    <td data-label="差異" style="font-weight:700;color:${x.diff && !x.first ? '#9A3412' : 'var(--success)'};">${escHtml(diffText)}</td>
    <td data-label="原因">${x.first ? '-' : (escHtml(x.reason) || '-')}</td>
  </tr>`;
  }).join('');
  document.getElementById('detailModal').classList.add('open');
};

// ── 2. 逐項盤點 ──
window.startCount = (type, slot) => {
  const draft = readDraft();
  if (draft && Object.keys(draft.counts || {}).length && !confirm('有一份暫存的盤點還沒完成，要放棄它並開始新的盤點嗎？')) return;
  // 成品盤點一定歸到中午或晚上；從下方「成品盤點」按鈕進來時依現在時間判斷
  if (type === '成品' && !slot) slot = slotNow();
  _cur = { type, slot: type === '成品' ? slot : '', counts: {}, reasons: {}, startedAt: Date.now() };
  saveDraft(false);
  openCount();
};
window.resumeDraft = () => {
  _cur = readDraft();
  _cur.reasons = _cur.reasons || {};
  openCount();
};
window.discardDraft = () => {
  if (!confirm('確定放棄這次暫存的盤點？')) return;
  clearDraft();
  loadHome();
};
window.leaveCount = () => { saveDraft(false); loadHome(); };

function countItems() {
  return _items.filter(i => COUNT_TYPES[_cur.type].kinds.includes(i.kind));
}

function openCount() {
  document.getElementById('cTitle').textContent = countTitle(_cur);
  // 已刪除的品項不再盤
  const ids = new Set(countItems().map(i => i.id));
  Object.keys(_cur.counts).forEach(id => { if (!ids.has(id)) delete _cur.counts[id]; });
  renderCount();
  show('vCount');
}

function renderCount() {
  const shown = countItems();
  document.getElementById('cList').innerHTML = shown.length ? shown.map(i => {
    const v = _cur.counts[i.id];
    const has = v !== undefined;
    const name = escHtml(i.name);
    const keys = `onfocus="this.select()" onkeydown="nextOnEnter(event)"`;
    let inputs;
    if (i.per) {
      const { b, p } = has ? splitBox(v, i.per) : { b: '', p: '' };
      const big = escHtml(i.unit), small = escHtml(i.sub);
      inputs = `<div class="inv-num"><input type="number" inputmode="numeric" min="0" step="1" value="${b}" placeholder="0" aria-label="${name} ${big}數" data-box ${keys} onchange="setBox('${i.id}')"><div class="inv-unit">${big}</div></div>
        <button class="plus" onclick="bump('${i.id}',1)" aria-label="增加一${big}">+</button>
        <span class="plus-sign">＋</span>
        <div class="inv-num pk"><input type="number" inputmode="decimal" min="0" step="any" value="${p}" placeholder="0" aria-label="${name} 零${small}數" data-pk ${keys} onchange="setBox('${i.id}')"><div class="inv-unit">${small}</div></div>`;
    } else {
      inputs = `<div class="inv-num"><input type="number" inputmode="decimal" min="0" step="any" value="${has ? v : ''}" placeholder="點我輸入" aria-label="${name} 數量" ${keys} onchange="setQty('${i.id}', this.value)"><div class="inv-unit">${escHtml(i.unit)}</div></div>
        <button class="plus" onclick="bump('${i.id}',1)" aria-label="增加">+</button>`;
    }
    return `<div class="inv-item${has ? ' done' : ''}" id="row-${i.id}">
      <div class="info">
        <div class="nm">${name}${has ? CHECK_MARK : ''}</div>
        ${i.spec ? `<div class="sp">${escHtml(i.spec)}</div>` : ''}
      </div>
      <div class="inv-step">
        <button class="minus" onclick="bump('${i.id}',-1)" aria-label="減少${i.per ? '一' + escHtml(i.unit) : ''}">−</button>
        ${inputs}
      </div>
    </div>`;
  }).join('') : '<div class="card text-muted text-center">沒有要盤點的品項</div>';
  updateProgress();
}

// 按 Enter 跳到下一格輸入框
window.nextOnEnter = (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const all = [...document.querySelectorAll('#cList input')];
  const next = all[all.indexOf(e.target) + 1];
  e.target.blur();
  if (next) next.focus();
};

// 雙單位品項：兩格合併成大單位數量（例：2 箱 3 包、每箱 7 包 → 2.428… 箱）
window.setBox = (id) => {
  const it = _items.find(i => i.id === id);
  const row = document.getElementById('row-' + id);
  if (!it || !row) return;
  const bs = row.querySelector('[data-box]').value, ps = row.querySelector('[data-pk]').value;
  if (bs === '' && ps === '') { setQty(id, ''); return; }
  const b = parseFloat(bs) || 0, p = parseFloat(ps) || 0;
  if (b < 0 || p < 0) { showToast('請輸入 0 以上的數字', 'error'); renderCount(); return; }
  setQty(id, String(b + p / it.per));
};

function updateProgress() {
  const list = countItems();
  const done = list.filter(i => _cur.counts[i.id] !== undefined).length;
  document.getElementById('cDone').textContent = done;
  document.getElementById('cTotal').textContent = list.length;
  document.getElementById('cBar').style.width = (list.length ? Math.round(done / list.length * 100) : 0) + '%';
}


window.bump = (id, d) => {
  const cur = _cur.counts[id];
  const per = _items.find(i => i.id === id)?.per;
  const n = (cur === undefined ? 0 : cur) + d;
  _cur.counts[id] = Math.max(0, per ? n : Math.round(n * 1000) / 1000);
  saveDraft(false);
  renderCount();
};

// 直接輸入時只更新該列，不重繪整個清單，避免跳到下一格時失去焦點
window.setQty = (id, val) => {
  if (val === '' || val === null) delete _cur.counts[id];
  else {
    const n = parseFloat(val);
    if (isNaN(n) || n < 0) { showToast('請輸入 0 以上的數字', 'error'); renderCount(); return; }
    _cur.counts[id] = n;
  }
  saveDraft(false);
  const row = document.getElementById('row-' + id);
  const has = _cur.counts[id] !== undefined;
  if (row) {
    row.classList.toggle('done', has);
    const nm = row.querySelector('.nm');
    const it = _items.find(i => i.id === id);
    if (nm && it) nm.innerHTML = escHtml(it.name) + (has ? CHECK_MARK : '');
  }
  updateProgress();
};

// ── 3. 核對差異 ──
window.goDiff = async () => {
  const list = countItems();
  const missing = list.filter(i => _cur.counts[i.id] === undefined);
  if (!COUNT_TYPES[_cur.type].partial && missing.length) {
    showToast(`還有 ${missing.length} 項沒盤：${missing.slice(0, 3).map(i => i.name).join('、')}${missing.length > 3 ? '…' : ''}`, 'error');
    const first = document.getElementById('row-' + missing[0].id);
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (!list.some(i => _cur.counts[i.id] !== undefined)) { showToast('請至少盤一個品項', 'error'); return; }

  // 重新讀取庫存，避免盤點期間有人登記異動
  const btn = document.getElementById('cNextBtn');
  btn.disabled = true; btn.textContent = '計算中…';
  try { _items = await loadItems(); }
  catch (e) { showToast('讀取庫存失敗，請重試', 'error'); return; }
  finally { btn.disabled = false; btn.textContent = '下一步：核對差異'; }

  // 從沒盤點過的品項系統數量不可信，視為「首次建檔」，不算差異
  _rows = countItems().filter(i => _cur.counts[i.id] !== undefined).map(i => {
    const diff = Math.round((_cur.counts[i.id] - i.stock) * 10000) / 10000;
    return {
      id: i.id, name: i.name, unit: i.unit, per: i.per, sub: i.sub,
      system: i.stock, counted: _cur.counts[i.id],
      first: !i.counted, diff: Math.abs(diff) < 0.0001 ? 0 : diff
    };
  });
  renderDiff();
  show('vDiff');
};

function renderDiff() {
  const firsts = _rows.filter(r => r.first);
  const diffs = _rows.filter(r => !r.first && r.diff !== 0);
  const same = _rows.filter(r => !r.first && r.diff === 0);
  document.getElementById('dTotal').textContent = _rows.length;
  document.getElementById('dSame').textContent = same.length;
  document.getElementById('dSame2').textContent = same.length;
  document.getElementById('dDiffN').textContent = diffs.length;
  document.getElementById('dHint').classList.toggle('hidden', !diffs.length);
  document.getElementById('dSameBox').classList.toggle('hidden', !same.length);
  document.getElementById('dSameList').innerHTML = same.map(r => escHtml(`${r.name} ${qtyText(r, r.counted)}`)).join(' · ');
  const firstBox = firsts.length ? `<div class="inv-first" style="grid-column:1/-1;">
    <h3>首次建檔（${firsts.length} 項）</h3>
    <p>這些品項第一次盤點，直接以實盤數量作為庫存，不用填原因。</p>
    <div class="list">${firsts.map(r => escHtml(`${r.name} ${qtyText(r, r.counted)}`)).join(' · ')}</div>
  </div>` : '';
  const diffCards = diffs.map(r => `<div class="inv-diff">
    <div class="top"><span class="nm">${escHtml(r.name)}</span><span class="delta">${r.diff > 0 ? '+' : ''}${escHtml(qtyText(r, r.diff))}</span></div>
    <div class="inv-cmp">
      <div><div class="l">系統應有</div><div class="v">${escHtml(qtyText(r, r.system))}</div></div>
      <div><div class="l">實際盤點</div><div class="v">${escHtml(qtyText(r, r.counted))}</div></div>
    </div>
    <div class="inv-reasons">${REASONS.map(rs =>
      `<button class="inv-reason${_cur.reasons[r.id] === rs ? ' on' : ''}" onclick="pickReason('${r.id}','${rs}')">${rs}</button>`).join('')}</div>
  </div>`).join('');
  document.getElementById('dList').innerHTML = (firstBox + diffCards) ||
    `<div class="inv-box" style="display:flex;align-items:center;justify-content:center;gap:8px;color:var(--green);font-weight:700;">${CHECK_MARK}全部品項與系統相符</div>`;
  updateSubmit();
}

// 原因選填：再點一次同一個原因可取消
window.pickReason = (id, rs) => {
  if (_cur.reasons[id] === rs) delete _cur.reasons[id]; else _cur.reasons[id] = rs;
  saveDraft(false);
  renderDiff();
};

function updateSubmit() {
  const btn = document.getElementById('dSubmitBtn');
  btn.disabled = false;
  btn.textContent = '送出盤點';
}

window.submitCount = async () => {
  const btn = document.getElementById('dSubmitBtn');
  btn.disabled = true; btn.textContent = '送出中…';
  const t = COUNT_TYPES[_cur.type];
  const items = _rows.map(({ per, sub, ...r }) => ({
    ...r, reason: r.first ? '首次建檔' : (r.diff !== 0 ? (_cur.reasons[r.id] || '') : '')
  }));
  const diffCount = items.filter(r => !r.first && r.diff !== 0).length;
  const firstCount = items.filter(r => r.first).length;
  try {
    const batch = writeBatch(db);
    const countRef = doc(collection(db, 'stockCounts'));
    batch.set(countRef, {
      date: todayStr(), type: _cur.type, slot: _cur.slot || '', title: countTitle(_cur),
      by: _ud.name, at: serverTimestamp(), total: items.length, diffCount, firstCount, items
    });
    items.forEach(r => {
      batch.update(doc(db, 'stockItems', r.id), r.diff !== 0
        ? { stock: r.counted, lastCountAt: serverTimestamp() }
        : { lastCountAt: serverTimestamp() });
      if (r.diff === 0) return;
      batch.set(doc(collection(db, 'stockMoves')), {
        itemId: r.id, itemName: r.name, unit: r.unit, type: r.first ? '首次建檔' : '盤點調整',
        qty: r.diff, before: r.system, after: r.counted, note: r.reason,
        countId: countRef.id, by: _ud.name, at: serverTimestamp()
      });
    });
    await batch.commit();
  } catch (e) {
    showToast('送出失敗，請檢查網路後重試', 'error');
    updateSubmit();
    return;
  }
  clearDraft();
  items.forEach(r => { const it = _items.find(i => i.id === r.id); if (it) { it.stock = r.counted; it.counted = true; } });
  renderDone(t, items, diffCount, firstCount);
  show('vDone');
};

// ── 4. 完成 ──
function renderDone(t, items, diffCount, firstCount) {
  const now = new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  let took = '';
  if (_cur.startedAt) {
    const sec = Math.max(0, Math.round((Date.now() - _cur.startedAt) / 1000));
    took = ` · 用時 ${sec >= 60 ? Math.floor(sec / 60) + ' 分 ' : ''}${sec % 60} 秒`;
  }
  document.getElementById('doneMeta').textContent = `${countTitle(_cur)} · ${now} · ${_ud.name}${took}`;
  const diffs = items.filter(r => !r.first && r.diff !== 0);
  const unitOf = (r) => _items.find(i => i.id === r.id) || r;
  const row = (tone, icon, title, sub) => `<div class="inv-li" style="justify-content:flex-start;">
    <div class="inv-ico ${tone}">${svg(icon, 22, 2.2)}</div>
    <div><div class="t">${title}</div><div class="m">${sub}</div></div></div>`;
  let html = row('ok', IC.box, '庫存已更新', `${items.length} 個品項以實盤數量為準`);
  if (firstCount) html += row('ok', IC.note, `首次建檔 ${firstCount} 項`, '第一次盤點的品項，已直接建立庫存');
  if (diffCount) {
    html += row('warn', IC.note, `差異 ${diffCount} 項已記錄`, diffs.map(r =>
      escHtml(`${r.name} ${r.diff > 0 ? '+' : ''}${qtyText(unitOf(r), r.diff)}${r.reason ? `（${r.reason}）` : ''}`)).join(' · '));
  } else if (!firstCount) {
    html += row('ok', IC.check, '全部相符', '沒有任何差異');
  }
  document.getElementById('doneList').innerHTML = html;
  document.getElementById('donePlan').innerHTML = planCard();
}
</script>
</body>
</html>
