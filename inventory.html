<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* 盤點頁配色依設計稿 */
.inv{--ink:#2B1D14;--mute:#6B5A4A;--line:#EEE3D0;--bg:#FBF6EC;--green:#C24A16;--green2:#F7B500;--warn:#8A3D08;--warnbg:#FDF1E6;--warnline:#F1D3B6;--okbg:#FFF0D1;
  max-width:1120px;font-family:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;color:var(--ink)}
body{background:#FBF6EC}
/* 讓內容區不被分類按鈕列等寬內容撐開（手機版右側被切掉的原因） */
.main{min-width:0}
.inv-chips{max-width:100%;scrollbar-width:none}
.inv-chips::-webkit-scrollbar{display:none}
.inv svg{flex-shrink:0}
.inv-top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 4px 16px}
.inv-top .who{font-size:14px;color:var(--mute)}
.inv-top h1{font-size:30px;font-weight:900;letter-spacing:1px;line-height:1.2}
.inv-top .day{font-size:15px;font-weight:500;color:var(--mute)}
.inv-hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px}
.inv-hero .hrow{display:flex;justify-content:space-between;align-items:center}
.inv-hero .lab{font-size:14px;color:#E9DCC8}
.inv-hero .sub{font-size:15px;color:#E9DCC8}
.inv-hero .ttl{font-size:24px;font-weight:900}
.inv-pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.inv-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.inv-tabs:empty{display:none}
.inv-tab{height:46px;border:none;border-radius:11px;background:none;font-family:inherit;font-size:17px;font-weight:900;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.inv-tab .n{font-size:13px;font-weight:700;color:var(--mute);background:#fff;border-radius:999px;padding:1px 8px}
.inv-tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inv-tab.on .n{background:var(--okbg);color:var(--green)}
.inv-group{grid-column:1/-1;font-size:15px;font-weight:900;color:var(--ink);margin:14px 4px 8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.inv-group:first-child{margin-top:2px}
.inv-stabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
.inv-stabs button{height:40px;border:none;border-radius:9px;background:none;color:#E9DCC8;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.inv-stabs button .n{font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:0 8px}
.inv-stabs button.on{background:#fff;color:#2B1D14}
.inv-stabs button.on .n{background:#FFF0D1;color:#C24A16}
.inv-plan tr.grp td{color:#F5C04A;font-weight:800;font-size:13px;padding-top:12px}
.inv-remind{background:#FFF7E0;border:1px solid #F5C04A;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:15px;line-height:1.7;color:#2B1D14}
.inv-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:480px){.inv-slots{gap:6px}.inv-slot{padding:10px 8px}.inv-slot .nm{font-size:15px;white-space:nowrap}.inv-slot .st{font-size:12px}}
.inv-slot{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;font-family:inherit;text-align:left;cursor:pointer}
.inv-slot:hover{background:rgba(255,255,255,.08)}
.inv-slot.now{border-color:#F7B500;box-shadow:inset 0 0 0 1px #F7B500}
.inv-slot .nm{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:900}
.inv-slot .st{font-size:13px;color:#E9DCC8}
.inv-slot.done .st{color:#FFD98A}
.inv-pill.todo{background:#F5C04A;color:#2B1D14}
.inv-pill.ok{background:#FFD98A;color:#3A2306}
.inv-big{height:56px;border-radius:14px;border:none;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.inv-big.go{height:60px;font-size:20px;background:var(--green2);color:#3A2306}
.inv-big.primary{background:var(--green);color:#fff}
.inv-big.dark{background:var(--ink);color:#fff}
.inv-big.ghost{background:#fff;color:var(--ink);border:1px solid #E0D3BF;font-weight:700}
.inv-big:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.inv-link{background:none;border:none;color:#E9DCC8;font-family:inherit;font-size:13px;cursor:pointer;align-self:center;text-decoration:underline}
.inv-types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.inv-type{height:84px;border:1px solid var(--line);background:#fff;border-radius:16px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.inv-type:hover{border-color:var(--green)}
.inv-sec{font-size:16px;font-weight:700;color:var(--mute);margin:4px 4px 8px}
.inv-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.inv-li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:none;border-top:1px solid var(--line);width:100%;background:#fff;font-family:inherit;text-align:left;color:inherit}
button.inv-li{cursor:pointer}
button.inv-li:hover{background:#FFFBF3}
.inv-li:first-child{border-top:none}
.inv-dbadge{flex-shrink:0;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.inv-dbadge:empty{display:none}
.inv-dbadge.bad{background:#FDECEC;color:#C62828}
.inv-dbadge.ok{background:#FFF0D1;color:#8A5A00}
.det-note{font-size:12px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.6}
.det-bad td{background:#FDECEC}
.det-why{display:block;font-size:11px;font-weight:400;color:var(--text2);margin-top:2px}
.dd-bad{color:#C62828;font-weight:700}
.inv-diff{background:#fff;border:1px solid #F3C4C4;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.inv-diff h3{font-size:16px;font-weight:900;color:#C62828;margin-bottom:6px}
.inv-diff div{font-size:14px;line-height:1.8}
.inv-diff.ok{border-color:#F5DFA8}
.inv-diff.ok h3{color:#8A5A00}
.inv-li .t{font-size:16px;font-weight:700}
.inv-li .m{font-size:13px;color:var(--mute);margin-top:2px}
.inv-tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.inv-tag.diff{color:var(--warn);background:var(--warnbg)}
.inv-tag.same{color:var(--green);background:var(--okbg)}
.inv-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inv-ico.ok{background:var(--okbg);color:var(--green)}
.inv-ico.warn{background:var(--warnbg);color:var(--warn)}
.inv-bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.inv-head{display:flex;align-items:center;gap:8px}
.inv-head h2{font-size:20px;font-weight:900}
.inv-head .hint{font-size:13px;color:var(--mute)}
.inv-back{width:44px;height:44px;border-radius:12px;border:none;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inv-back:hover{background:var(--bg)}
.inv-count{font-size:18px;font-weight:900;white-space:nowrap}
.inv-count small{font-size:14px;font-weight:500;color:var(--mute)}
.inv-prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.inv-prog>div{height:100%;background:var(--green2);border-radius:999px;transition:width .2s}
.inv-chips{display:flex;gap:8px;overflow-x:auto}
.inv-chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid #E0D3BF;background:#fff;font-family:inherit;font-size:15px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink)}
.inv-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.inv-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px;border-radius:16px;background:#fff;border:2px dashed #E0D3BF;margin-bottom:10px}
.inv-item.done{border:1px solid var(--line)}
.inv-item .info{flex:1 1 120px;min-width:0}
.inv-item .nm{font-size:19px;font-weight:900;display:flex;align-items:center;gap:6px}
.inv-item .sp{font-size:13px;color:var(--mute);margin-top:2px}
.inv-step{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
.inv-step button{width:48px;height:48px;border-radius:12px;font-size:26px;font-weight:700;cursor:pointer;font-family:inherit}
.inv-step .minus{background:#fff;border:1px solid #E0D3BF;color:var(--ink)}
.inv-step .plus{background:var(--green);border:none;color:#fff}
.inv-num{display:flex;flex-direction:column;align-items:center;gap:2px}
.inv-step input{width:72px;height:48px;text-align:center;font-size:22px;font-weight:900;border:1.5px solid #E0D3BF;border-radius:12px;font-family:inherit;background:#fff;color:var(--ink);padding:0 4px;-moz-appearance:textfield}
.inv-step input::-webkit-outer-spin-button,.inv-step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inv-step input::placeholder{color:#BBAA94;font-weight:500;font-size:15px}
.inv-step input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(194,74,22,.15)}
.inv-step .pk input{width:60px}
.inv-step .plus-sign{font-size:18px;font-weight:700;color:var(--mute);padding:0 2px 16px}
.inv-unit{font-size:12px;color:var(--mute);text-align:center}
.inv-foot{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:4px;display:flex;gap:10px}
.inv-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.inv-box summary{font-size:16px;font-weight:700;cursor:pointer}
.inv-done-ic{width:88px;height:88px;border-radius:999px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:24px auto 10px}
.inv-plan{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.inv-plan .lab{font-size:14px;color:#E9DCC8}
.inv-plan .row{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.inv-plan .row span:last-child{color:#E9DCC8;text-align:right}
.inv-plan b{color:#F5C04A}
.inv-plan .hd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#F5C04A}
.inv-plan table{width:100%;border-collapse:collapse;font-size:15px}
.inv-plan th{background:none;border:none;padding:4px 0 6px;font-size:12px;font-weight:500;color:#B3A28C;text-align:right;white-space:nowrap}
.inv-plan th:first-child,.inv-plan td:first-child{text-align:left}
.inv-plan td{border:none;border-top:1px solid rgba(255,255,255,.1);padding:8px 0;text-align:right;color:#E9DCC8;white-space:nowrap}
.inv-plan td:first-child{color:#fff;font-weight:700}
.inv-plan tr:hover td{background:none}
.inv-plan .inv-big{height:48px;font-size:16px;border-radius:12px;margin-top:4px}
#vDone{max-width:640px;margin:0 auto}
.det-edit{display:flex;gap:8px;flex-wrap:wrap}
.det-cell{display:flex;align-items:center;gap:4px}
.det-cell input{width:76px;height:38px;text-align:center;font-size:16px;font-weight:700;border:1.5px solid #E0D3BF;border-radius:8px;font-family:inherit}
.det-cell input:focus{outline:none;border-color:#C24A16}
.det-cell span{font-size:13px;color:#6B5A4A}
.inv-sheet{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.inv-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.inv-row:first-child{border-top:none}
.inv-row:nth-child(even){background:#FFFBF3}
.inv-row.done{background:#FFF6E3}
.inv-row .no{font-size:14px;font-weight:700;color:#BBAA94;text-align:center}
.inv-row .nm{font-size:18px;font-weight:900;display:flex;align-items:center;gap:6px}
.inv-row .sp{font-size:13px;color:var(--mute);margin-top:1px}
.inv-row .qty{display:grid;grid-template-columns:repeat(2,112px);gap:8px}
.inv-row .cell{display:flex;align-items:center;gap:6px;cursor:text}
.inv-row .cell input{width:72px;height:46px;text-align:center;font-size:22px;font-weight:900;border:1.5px solid #E0D3BF;border-radius:10px;font-family:inherit;background:#fff;color:var(--ink);padding:0 4px;-moz-appearance:textfield}
.inv-row .cell input::-webkit-outer-spin-button,.inv-row .cell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inv-row .cell input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(194,74,22,.15)}
.inv-row.done .cell input{border-color:#F5C46A}
.inv-row .cell .u{font-size:15px;font-weight:700;color:var(--mute);min-width:28px}
#vCount{max-width:820px}
@media(max-width:520px){
  .inv-row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px}
  .inv-row .no{display:none}
  .inv-row .qty{grid-template-columns:repeat(2,92px);gap:6px}
  .inv-row .cell input{width:58px}
}
@media(min-width:1000px){
  .inv-home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
  .inv-top h1{font-size:34px}
}
@media(max-width:768px){.inv{max-width:none}.inv-top{margin-top:0}.inv-bar{top:60px}}
</style>
</head>
<body>
<div class="mob-header">
  <button class="mob-menu-btn" onclick="toggleMenu()">☰</button>
  <span class="mob-title">📦 盤點</span>
  <span></span>
</div>
<div class="mob-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><h2><img src="icon.svg" alt="" class="sb-logo">央廚盤點</h2><p>庫存管理</p></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-user" id="sb-user-area"><div class="uname" style="color:rgba(255,255,255,.4);font-size:12px;">載入中…</div></div>
  </aside>
  <main class="main">
    <div class="inv">

    <!-- 1. 盤點首頁 -->
    <section id="vHome">
      <div class="inv-top">
        <div><div class="who" id="homeWho"></div><h1>盤點</h1></div>
        <div class="day" id="homeDay"></div>
      </div>
      <div id="homeBody"><div class="text-muted">載入中…</div></div>
    </section>

    <!-- 2. 逐項盤點 -->
    <section id="vCount" class="hidden">
      <div class="inv-bar">
        <div class="inv-head">
          <button class="inv-back" onclick="leaveCount()" aria-label="返回">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
          </button>
          <div style="flex:1;min-width:0;">
            <h2 id="cTitle"></h2>
            <div class="hint">盲盤模式 · 不顯示系統數量</div>
          </div>
          <div class="inv-count"><span id="cDone">0</span><small> / <span id="cTotal">0</span></small></div>
        </div>
        <div class="inv-prog"><div id="cBar" style="width:0%;"></div></div>
        <div class="inv-tabs" id="cTabs" role="tablist"></div>
      </div>
      <div id="cList"></div>
      <div class="inv-foot">
        <button class="inv-big ghost" style="width:110px;font-size:17px;" onclick="saveDraft(true)">暫存</button>
        <button class="inv-big primary" id="cNextBtn" onclick="saveCount()">儲存盤點</button>
      </div>
    </section>

    <!-- 3. 盤點完成 -->
    <section id="vDone" class="hidden">
      <div class="inv-done-ic">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      </div>
      <div style="text-align:center;font-size:28px;font-weight:900;">盤點完成</div>
      <div style="text-align:center;font-size:15px;color:var(--mute);margin:6px 0 18px;" id="doneMeta"></div>
      <div id="doneList"></div>
      <div class="flex gap-2">
        <a href="stock.html" class="inv-big ghost" style="font-size:16px;">查看品項庫存</a>
        <button class="inv-big dark" style="font-size:16px;" onclick="backHome()">回首頁</button>
      </div>
    </section>

    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<!-- 盤點紀錄明細 -->
<div class="modal-bg" id="detailModal">
  <div class="modal" style="width:560px;">
    <div class="modal-title" id="detTitle"></div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px;" id="detMeta"></div>
    <div id="detNote"></div>
    <div class="table-wrap">
      <table>
        <thead id="detHead"></thead>
        <tbody id="detTable"></tbody>
      </table>
    </div>
    <div class="flex gap-2 mt-4" id="detActs"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, query, where, orderBy, limit, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { getUserData, showToast, renderSidebar, todayStr, loadStockItems, fmtQty, escHtml, splitBox, qtyText, KINDS, loadSuppliers, expectedStock, diffAlert, addDays, KITCHEN, kitchenName, kf, ofKitchen } from "./app.js?v=20261009m";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, 'default');

window.toggleMenu = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); };
window.doSignOut = async () => { sessionStorage.clear(); await signOut(auth); window.location.href = 'index.html'; };
window.closeDetail = () => document.getElementById('detailModal').classList.remove('open');
document.getElementById('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') closeDetail(); });

const svg = (paths, size = 24, sw = 2, color = 'currentColor') =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const IC = {
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path>',
  search: '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path>',
  warn: '<path d="M12 3l10 18H2L12 3z"></path><path d="M12 10v5"></path><path d="M12 18h.01"></path>',
  arrow: '<path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>',
  check: '<path d="M5 12l5 5 9-10"></path>',
  note: '<rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h4"></path>'
};

const COUNT_TYPES = {

// 成品每天盤兩次；15:00 前算中午，之後算晚上
const SLOTS = ['中午', '晚上'];
const slotNow = () => new Date().getHours() < 15 ? '中午' : '晚上';
const countTitle = (c) => c.slot ? `${c.slot}盤點` : COUNT_TYPES[c.type].title;
// 暫存的盤點每間央廚各自一份
const draftKey = () => KITCHEN === 'ha' ? 'inv_draft' : `inv_draft_${KITCHEN}`;

let _ud = null;

let _recent = [];
// 進行中的盤點：{ type, slot, counts: {itemId: number}, startedAt }

// 與 loadStockItems 相同（counted＝這間央廚盤點過）

  return items.map(i => ({ ...i, kind: i.countAs || i.kind, realKind: i.kind }));

// 這間央廚最近 10 次盤點（三間的紀錄放在一起，多讀一些再挑出這間的）

const fmtAt = (ts) => ts?.toDate ? ts.toDate().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '';

// ── 1. 首頁 ──
async function loadHome() {
  show('vHome');
  _copyHeader = '';
  const now = new Date();
  document.getElementById('homeWho').textContent = `${kitchenName()} · ${_ud.name}`;
  document.getElementById('homeDay').textContent = `${now.getMonth() + 1}/${now.getDate()}（${'日一二三四五六'[now.getDay()]}）`;
  const body = document.getElementById('homeBody');
  try {
    [_items, _recent] = await Promise.all([loadItems(), loadRecent()]);
  } catch (e) {
    body.innerHTML = '<div class="card text-muted text-center">載入失敗，請重新整理</div>';
    return;
  }

  if (!_items.length) {
    body.innerHTML = `<div class="card text-center" style="padding:28px;">
      <div style="font-size:15px;margin-bottom:12px;">還沒有任何品項，請先建立要盤點的品項</div>
      <a href="stock.html" class="btn btn-primary">前往品項庫存</a></div>`;
    return;
  }

  const today = todayStr();
  const draft = readDraft();
  const nFinished = _items.length;
  const doneOf = (s) => _recent.find(r => r.date === today && r.type === '成品' && r.slot === s);
  // 今天的三個任務：中午成品、晚上成品、食材（每天一次）
  const nOf = (k) => _items.filter(i => i.kind === k).length;
  const TASKS = [
    ...SLOTS.map(s => ({ name: `${s}盤點`, sub: `成品 ${nOf('成品')} 項`, go: `startCount('成品','${s}')`, done: doneOf(s), slot: s })),
    { name: '食材盤點', sub: `食材 ${nOf('食材')} 項`, go: `startCount('食材')`, done: _recent.find(r => r.date === today && r.type === '食材'), slot: '' }
  ].filter(t => t.slot || nOf('食材'));

  let html = '';
  const n = Object.keys(draft?.counts || {}).length;
  if (draft && COUNT_TYPES[draft.type] && n) {
    html += `<div class="inv-hero">
      <div class="hrow"><span class="lab">未完成的盤點</span><span class="inv-pill todo">進行中</span></div>
      <div class="ttl">${escHtml(countTitle(draft))}</div>

      <button class="inv-big go" onclick="resumeDraft()">繼續盤點 ${svg(IC.arrow, 22, 2.5)}</button>
      <button class="inv-link" onclick="discardDraft()">放棄這次暫存</button>
    </div>`;
  } else {
    // 主按鈕：優先盤現在這個時段的成品，再來是食材，最後是另一個時段
    const now = slotNow();
    const order = [TASKS.find(t => t.slot === now), TASKS.find(t => !t.slot), ...TASKS.filter(t => t.slot && t.slot !== now)].filter(Boolean);
    const allDone = TASKS.every(t => t.done);
    const target = order.find(t => !t.done) || TASKS.find(t => t.slot === now);
    html += `<div class="inv-hero">
      <div class="hrow"><span class="lab">今日任務</span><span class="inv-pill ${allDone ? 'ok' : 'todo'}">${TASKS.filter(t => t.done).length} / ${TASKS.length} 完成</span></div>
      <div class="inv-slots" style="grid-template-columns:repeat(${TASKS.length},minmax(0,1fr));">${TASKS.map(t => `<button class="inv-slot${t.done ? ' done' : ''}${t === target && !allDone ? ' now' : ''}" onclick="${t.go}" ${nFinished ? '' : 'disabled'}>
          <span class="nm">${t.done ? svg(IC.check, 18, 3, '#F7B500') : ''}${t.name}</span>
          <span class="st">${t.done ? `${escHtml(t.done.by)} · ${fmtAt(t.done.at).slice(-5)} 完成` : escHtml(t.sub)}</span>
        </button>`).join('')}</div>
      <button class="inv-big go" onclick="${target.go}" ${nFinished ? '' : 'disabled'}>${allDone ? `再盤一次（${target.name}）` : `開始${target.name}`} ${svg(IC.arrow, 22, 2.5)}</button>
    </div>`;
  }

  // 沒有品項的盤點類型不顯示（例如尚未建立原物料）
  const types = Object.entries(COUNT_TYPES).filter(([, t]) => t.extra && _items.some(i => t.kinds.includes(i.kind)));
  html += `<div class="inv-types" style="grid-template-columns:repeat(${types.length},minmax(0,1fr));">${types.map(([k, t]) =>
    `<button class="inv-type" onclick="startCount('${k}')">${svg(t.ic, 24, 2, '#C24A16')}${t.title}</button>`).join('')}</div>`;

  html += `<div class="inv-sec">最近盤點</div>`;
  html += _recent.length
    ? `<div class="inv-list">${_recent.map(r => `<button class="inv-li" onclick="openDetail('${r.id}')">
        <div><div class="t">${escHtml(r.date.slice(5).replace('-', '/'))} ${escHtml(r.title)}</div><div class="m">${escHtml(r.by)} · ${fmtAt(r.at)} · ${r.total} 項</div></div>
        <span class="inv-dbadge" id="db-${r.id}"></span>
      </button>`).join('')}</div>`
    : '<div class="inv-list"><div class="inv-li" style="color:var(--mute);justify-content:center;">尚無盤點紀錄</div></div>';

  // 副產品（例：雞湯）低於安全庫存時，提醒現場撈取
  const scoop = _items.filter(i => i.byproduct && i.safety > 0 && i.stock < i.safety);
  const remind = scoop.length ? `<div class="inv-remind" role="status">${scoop.map(i =>
    `<div>🔔 <strong>提醒撈取：${escHtml(i.label)}</strong> 剩 ${escHtml(qtyText(i, i.stock))}，標準 ${escHtml(qtyText(i, i.safety))}，還差 <strong>${escHtml(qtyText(i, i.safety - i.stock))}</strong>${i.byproductOf ? `（${escHtml(i.byproductOf)}）` : ''}</div>`).join('')}</div>` : '';
  loadDiffs().then(() => _recent.forEach(r => {
    const el = document.getElementById('db-' + r.id);
    const df = _diffs[r.id];
    if (!el || !df?.rows) return;
    el.className = 'inv-dbadge ' + (df.alerts.length ? 'bad' : 'ok');
    el.textContent = df.alerts.length ? `⚠️ ${df.alerts.length} 項差異` : '✓ 數量正常';
  })).catch(() => {});
  body.innerHTML = `${remind}<div class="inv-home"><div>${html}</div><div>${stockCard('目前庫存', lastCountText())}</div></div>`;
}

// 完整庫存清單：全部品項的目前數量

    ${kinds.length > 1 ? `<div class="inv-stabs" role="tablist">${kinds.map(k =>

// 複製成可以貼到 LINE 的文字
let _copyHeader = '';
function stockText(header, rows) {
  // 依種類分段：〔成品〕、〔食材〕
  const lines = rows.map((r, k) => {
    const kind = r.u?.kind || '';
    const multi = new Set(rows.map(x => x.u?.kind)).size > 1;
    const head = multi && kind && (k === 0 || rows[k - 1].u?.kind !== kind) ? `${k ? '\n' : ''}〔${kind}〕\n` : '';
    return `${head}${r.name}：${qtyText(r.u, r.qty)}`;
  });
  return `【庫存】${header}\n${lines.join('\n')}`;
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已複製，可以貼到 LINE', 'success');
  } catch (e) {
    showToast('複製失敗，請改用截圖', 'error');
  }
}
window.copyStock = () => {
  const now = new Date();
  const header = _copyHeader || `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  copyText(stockText(`${header} ${_stockTab}`, _items.filter(i => i.kind === _stockTab).map(i => ({ name: i.label, u: i, qty: i.stock }))));

window.backHome = () => loadHome();

function lastCountText() {
  const r = _recent[0];
  return r ? `最後盤點：${r.date.slice(5).replace("-", "/")} ${r.title} · ${r.by} · ${fmtAt(r.at).slice(-5)}` : "尚未盤點";
}

// ── 盤點差異：照系統算的量推「應該剩多少」，跟晚上盤點比對 ──
let _hist = [], _orders = {}, _supCfg = {}, _diffs = {};
async function loadDiffs() {
  const [cs, os, sups] = await Promise.all([
    getDocs(query(collection(db, 'stockCounts'), where('date', '>=', addDays(todayStr(), -14)))),
    getDocs(collection(db, 'orders')),
    loadSuppliers(db, _items)
  ]);
  _hist = cs.docs.map(d => ({ id: d.id, ...d.data() })).filter(ofKitchen).sort((a, b) => (a.at?.toMillis?.() ?? Infinity) - (b.at?.toMillis?.() ?? Infinity));
  _orders = {};
  os.docs.forEach(d => { const o = d.data(), q = o.qty || {}; if (ofKitchen(o) && Object.keys(q).length) _orders[o.date || d.id] = q; });
  _supCfg = {};
  sups.forEach(sp => { _supCfg[sp.name] = sp; });
  _diffs = {};
  _recent.forEach(r => { _diffs[r.id] = diffOf(r); });
}
// 某天結束時的庫存：那天（含）以前最後一次盤點的數量
function snapAt(date) {
  const snap = {};
  _hist.forEach(c => { if (c.date <= date) (c.items || []).forEach(x => { snap[x.id] = x.counted; }); });
  return snap;
}
// 回傳 null＝不比對；{ why }＝不能比對的原因；{ rows, alerts }＝比對結果
function diffOf(r) {
  if (r.slot !== '晚上' && r.type !== '食材') return null;
  const prevIds = new Set(_hist.filter(c => c.date === addDays(r.date, -1)).flatMap(c => (c.items || []).map(x => x.id)));
  if (!(r.items || []).some(x => prevIds.has(x.id))) return { why: '前一天沒有盤點，沒辦法比對' };
  if (!_orders[r.date]) return { why: '這天沒有輸入店面叫貨量，沒辦法比對' };
  const exp = expectedStock(_items, _supCfg, r.date, _orders, snapAt);
  const rows = (r.items || []).map(x => {
    const it = _items.find(i => i.id === x.id), e = exp[x.id];
    if (!it || !e || !prevIds.has(x.id)) return null;
    const expect = Math.round(e.expect * 100) / 100;
    return { x, it, e, expect, d: Math.round((x.counted - expect) * 100) / 100, alert: diffAlert(it, expect, x.counted) };
  }).filter(Boolean);
  return { rows, alerts: rows.filter(z => z.alert) };
}
const diffText = (it, d) => Math.abs(d) < 1e-9 ? '－' : `${d > 0 ? '多' : '少'} ${qtyText(it, Math.abs(d))}`;
const whyText = (z) => [`前晚 ${qtyText(z.it, z.e.prev)}`, z.e.made ? `＋做 ${qtyText(z.it, z.e.made)}` : '', z.e.arrived ? `＋到貨 ${qtyText(z.it, z.e.arrived)}` : '',
  z.e.used ? `－${z.it.realKind === '成品' ? '出貨' : '用掉'} ${qtyText(z.it, Math.round(z.e.used * 100) / 100)}` : ''].filter(Boolean).join(' ');
const DIFF_NOTE = '應該剩＝前一天晚上盤點＋照生產單做的＋照叫貨單到的貨－店面出貨和生產用掉的。差很多可能是：耗損、盤錯，或那天沒照系統的量做／叫。';

let _detail = null;
let _detEdit = false;
window.openDetail = (id) => {
  const r = _recent.find(x => x.id === id);
  if (!r) return;
  _detail = r;
  _detEdit = false;
  renderDetail();
  document.getElementById('detailModal').classList.add('open');
};
function renderDetail() {
  const r = _detail;
  document.getElementById('detTitle').textContent = `${r.date} ${r.title}${_detEdit ? '・修改數量' : ''}`;
  document.getElementById('detMeta').textContent = `${r.by}・${fmtAt(r.at)}・共 ${r.total} 項${r.editedBy ? `・${r.editedBy} 修改過` : ''}`;
  const df = _detEdit ? null : _diffs[r.id];
  const dmap = {};
  (df?.rows || []).forEach(z => { dmap[z.x.id] = z; });
  document.getElementById('detNote').innerHTML = df ? `<div class="det-note">${df.why ? '📊 ' + escHtml(df.why) : `📊 ${df.alerts.length ? `<b style="color:#C62828;">有 ${df.alerts.length} 項跟應該剩的差比較多</b>` : '<b>數量都跟應該剩的差不多</b>'}<br>${DIFF_NOTE}`}</div>` : '';
  const withDiff = !!df?.rows;
  document.getElementById('detHead').innerHTML = `<tr><th>品名</th><th>盤點數量</th>${withDiff ? '<th>應該剩</th><th>差異</th>' : ''}</tr>`;
  document.getElementById('detTable').innerHTML = (r.items || []).map((x, k) => {
    const u = _items.find(i => i.id === x.id) || x;
    let cell = escHtml(qtyText(u, x.counted));
    if (_detEdit) {
      const inp = (v, attr, unit) => `<label class="det-cell"><input type="number" min="0" step="any" inputmode="decimal" value="${v}" ${attr} aria-label="${escHtml(x.name)} ${escHtml(unit)}"><span>${escHtml(unit)}</span></label>`;
      if (u.per) {
        const { b, p } = splitBox(x.counted, u.per);
        cell = `<div class="det-edit" data-k="${k}">${inp(b, 'data-box', u.unit)}${inp(p, 'data-pk', u.sub)}</div>`;
      } else {
        cell = `<div class="det-edit" data-k="${k}">${inp(x.counted, 'data-one', u.unit || x.unit || '')}</div>`;
      }
    }
    const z = dmap[x.id];
    return `<tr class="${z?.alert ? 'det-bad' : ''}">
    <td data-label="品名" style="font-weight:700;">${escHtml(x.name)}${z?.alert ? `<span class="det-why">${escHtml(whyText(z))}</span>` : ''}</td>
    <td data-label="盤點數量">${cell}</td>
    ${withDiff ? `<td data-label="應該剩">${z ? escHtml(qtyText(z.it, z.expect)) : '－'}</td><td data-label="差異" class="${z?.alert ? 'dd-bad' : ''}">${z ? escHtml(diffText(z.it, z.d)) : '－'}</td>` : ''}
  </tr>`;
  }).join('');
  // 只有最近一次盤點可以修改：之後若又盤點過，庫存已被新的盤點覆蓋
  const canEdit = _recent[0]?.id === r.id;
  document.getElementById('detActs').innerHTML = _detEdit
    ? `<button class="btn btn-primary w-full" id="detSaveBtn" onclick="saveDetailEdit()">儲存修改</button><button class="btn btn-outline" onclick="cancelDetailEdit()">取消</button>`
    : `<button class="btn btn-primary w-full" onclick="copyDetail()">複製這次庫存</button>${canEdit ? '<button class="btn btn-outline" style="white-space:nowrap;" onclick="startDetailEdit()">修改數量</button>' : ''}<button class="btn btn-outline" onclick="closeDetail()">關閉</button>`;
}
window.startDetailEdit = () => { _detEdit = true; renderDetail(); };
window.cancelDetailEdit = () => { _detEdit = false; renderDetail(); };

// 修改盤點數量：庫存加減「新數量－原盤點數量」，並記一筆「盤點修正」異動
window.saveDetailEdit = async () => {
  const r = _detail;
  const changes = [];
  for (const el of document.querySelectorAll('#detTable .det-edit')) {
    const x = r.items[Number(el.dataset.k)];
    const u = _items.find(i => i.id === x.id);
    const val = (sel) => { const v = el.querySelector(sel)?.value ?? ''; return v === '' ? 0 : parseFloat(v); };
    const n = u?.per ? val('[data-box]') + val('[data-pk]') / u.per : val('[data-one]');
    if (isNaN(n) || n < 0) { showToast(`「${x.name}」請輸入 0 以上的數字`, 'error'); return; }
    const d = Math.round((n - x.counted) * 10000) / 10000;
    if (Math.abs(d) >= 0.0001) changes.push({ x, n, d });
  }
  if (!changes.length) { _detEdit = false; renderDetail(); showToast('沒有修改', 'success'); return; }
  const btn = document.getElementById('detSaveBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    _items = await loadItems();
    const batch = writeBatch(db);
    const items = r.items.map(x => {
      const c = changes.find(c => c.x === x);
      return c ? { ...x, counted: c.n, diff: Math.round((c.n - x.system) * 10000) / 10000 } : x;
    });
    batch.update(doc(db, 'stockCounts', r.id), { items, editedBy: _ud.name, editedAt: serverTimestamp() });
    changes.forEach(({ x, n, d }) => {
      const it = _items.find(i => i.id === x.id);
      if (!it) return;
      batch.update(doc(db, 'stockItems', x.id), { [kf('stock')]: Math.round((it.stock + d) * 10000) / 10000 });
      batch.set(doc(collection(db, 'stockMoves')), {
        itemId: x.id, itemName: x.name, unit: x.unit, type: '盤點修正',
        qty: d, before: it.stock, after: Math.round((it.stock + d) * 10000) / 10000,
        note: `${r.date} ${r.title}：${fmtQty(x.counted)} → ${fmtQty(n)}`,
        countId: r.id, kitchen: KITCHEN, by: _ud.name, at: serverTimestamp()
      });
    });
    await batch.commit();
    showToast(`已修改 ${changes.length} 項，庫存已更新`, 'success');
    closeDetail();
    loadHome();
  } catch (e) {
    showToast('儲存失敗，請檢查網路後重試', 'error');
    btn.disabled = false; btn.textContent = '儲存修改';
  }
};
window.copyDetail = () => {
  const r = _detail;
  if (!r) return;
  copyText(stockText(`${r.date.slice(5).replace('-', '/')} ${r.title}`,
    (r.items || []).map(x => ({ name: x.name, u: _items.find(i => i.id === x.id) || x, qty: x.counted }))));
};

// ── 2. 逐項盤點 ──
window.startCount = (type, slot) => {
  const draft = readDraft();
  if (draft && Object.keys(draft.counts || {}).length && !confirm('有一份暫存的盤點還沒完成，要放棄它並開始新的盤點嗎？')) return;
  // 成品盤點一定歸到中午或晚上；從下方「成品盤點」按鈕進來時依現在時間判斷
  if (type === '成品' && !slot) slot = slotNow();
  _cur = { type, slot: type === '成品' ? slot : '', counts: {}, startedAt: Date.now() };
  saveDraft(false);
  openCount();
};
window.resumeDraft = () => {
  _cur = readDraft();
  openCount();
};
window.discardDraft = () => {
  if (!confirm('確定放棄這次暫存的盤點？')) return;
  clearDraft();
  loadHome();
};
window.leaveCount = () => { saveDraft(false); loadHome(); };

function countItems() {
  return _items.filter(i => COUNT_TYPES[_cur.type].kinds.includes(i.kind));
}

function openCount() {
  document.getElementById('cTitle').textContent = countTitle(_cur);
  // 已刪除的品項不再盤
  const ids = new Set(countItems().map(i => i.id));
  Object.keys(_cur.counts).forEach(id => { if (!ids.has(id)) delete _cur.counts[id]; });
  renderCount();
  show('vCount');
}

function renderCount() {
  // 成品、食材分頁，一次只顯示一種
  const all = countItems();
  const kinds = KINDS.filter(k => all.some(i => i.kind === k));
  if (!kinds.includes(_cur.tab)) _cur.tab = kinds[0];
  renderTabs(all, kinds);
  const shown = all.filter(i => i.kind === _cur.tab);
  document.getElementById('cList').innerHTML = shown.length ? '<div class="inv-sheet">' + shown.map((i, k) => {
    const v = _cur.counts[i.id];
    const has = v !== undefined;
    const name = escHtml(i.label);
    const keys = `onfocus="this.select()" onkeydown="nextOnEnter(event)"`;
    let inputs;
    if (i.per) {
      const { b, p } = has ? splitBox(v, i.per) : { b: '', p: '' };
      const big = escHtml(i.unit), small = escHtml(i.sub);
      inputs = `<label class="cell"><input type="number" inputmode="numeric" min="0" step="1" value="${b}" aria-label="${name} ${big}數" data-box ${keys} onchange="setBox('${i.id}')"><span class="u">${big}</span></label>
        <label class="cell"><input type="number" inputmode="decimal" min="0" step="any" value="${p}" aria-label="${name} 零${small}數" data-pk ${keys} onchange="setBox('${i.id}')"><span class="u">${small}</span></label>`;
    } else {
      inputs = `<label class="cell"><input type="number" inputmode="decimal" min="0" step="any" value="${has ? v : ''}" aria-label="${name} 數量" ${keys} onchange="setQty('${i.id}', this.value)"><span class="u">${escHtml(i.unit)}</span></label><span></span>`;
    }
    return `<div class="inv-row${has ? ' done' : ''}" id="row-${i.id}">
      <div class="no">${k + 1}</div>
      <div class="info">
        <div class="nm">${name}${has ? CHECK_MARK : ''}</div>
        ${i.spec ? `<div class="sp">${escHtml(i.spec)}</div>` : ''}
      </div>
      <div class="qty">${inputs}</div>
    </div>`;
  }).join('') + '</div>' : '<div class="card text-muted text-center">沒有要盤點的品項</div>';
  updateProgress();
}

// 按 Enter 跳到下一格輸入框
window.nextOnEnter = (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const all = [...document.querySelectorAll('#cList input')];
  const next = all[all.indexOf(e.target) + 1];
  e.target.blur();
  if (next) next.focus();
};

// 雙單位品項：兩格合併成大單位數量（例：2 箱 3 包、每箱 7 包 → 2.428… 箱）
window.setBox = (id) => {
  const it = _items.find(i => i.id === id);
  const row = document.getElementById('row-' + id);
  if (!it || !row) return;
  const bs = row.querySelector('[data-box]').value, ps = row.querySelector('[data-pk]').value;
  if (bs === '' && ps === '') { setQty(id, ''); return; }
  const b = parseFloat(bs) || 0, p = parseFloat(ps) || 0;
  if (b < 0 || p < 0) { showToast('請輸入 0 以上的數字', 'error'); renderCount(); return; }
  setQty(id, String(b + p / it.per));
};

function renderTabs(all, kinds) {
  document.getElementById('cTabs').innerHTML = kinds.length > 1 ? kinds.map(k => {
    const list = all.filter(i => i.kind === k);
    const done = list.filter(i => _cur.counts[i.id] !== undefined).length;
    const on = k === _cur.tab;
    return `<button type="button" role="tab" aria-selected="${on}" class="inv-tab${on ? ' on' : ''}" onclick="pickTab('${k}')">${k}<span class="n">${done} / ${list.length}</span></button>`;
  }).join('') : '';
}
window.pickTab = (k) => { _cur.tab = k; renderCount(); window.scrollTo(0, 0); };

function updateProgress() {
  renderTabs(countItems(), KINDS.filter(k => countItems().some(i => i.kind === k)));
  const list = countItems();
  const done = list.filter(i => _cur.counts[i.id] !== undefined).length;
  document.getElementById('cDone').textContent = done;
  document.getElementById('cTotal').textContent = list.length;
  document.getElementById('cBar').style.width = (list.length ? Math.round(done / list.length * 100) : 0) + '%';
}


window.bump = (id, d) => {
  const cur = _cur.counts[id];
  const per = _items.find(i => i.id === id)?.per;
  const n = (cur === undefined ? 0 : cur) + d;
  _cur.counts[id] = Math.max(0, per ? n : Math.round(n * 1000) / 1000);
  saveDraft(false);
  renderCount();
};

// 直接輸入時只更新該列，不重繪整個清單，避免跳到下一格時失去焦點
window.setQty = (id, val) => {
  if (val === '' || val === null) delete _cur.counts[id];
  else {
    const n = parseFloat(val);
    if (isNaN(n) || n < 0) { showToast('請輸入 0 以上的數字', 'error'); renderCount(); return; }
    _cur.counts[id] = n;
  }
  saveDraft(false);
  const row = document.getElementById('row-' + id);
  const has = _cur.counts[id] !== undefined;
  if (row) {
    row.classList.toggle('done', has);
    const nm = row.querySelector('.nm');
    const it = _items.find(i => i.id === id);
    if (nm && it) nm.innerHTML = escHtml(it.label) + (has ? CHECK_MARK : '');
  }
  updateProgress();
};

// ── 3. 儲存盤點 ──
window.saveCount = async () => {
  const list = countItems();
  const missing = list.filter(i => _cur.counts[i.id] === undefined);
  if (!COUNT_TYPES[_cur.type].partial && missing.length) {
    showToast(`還有 ${missing.length} 項沒盤：${missing.slice(0, 3).map(i => i.label).join('、')}${missing.length > 3 ? '…' : ''}`, 'error');
    if (missing[0].kind !== _cur.tab) { _cur.tab = missing[0].kind; renderCount(); }
    const first = document.getElementById('row-' + missing[0].id);
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (!list.some(i => _cur.counts[i.id] !== undefined)) { showToast('請至少盤一個品項', 'error'); return; }

  const btn = document.getElementById('cNextBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    // 重新讀取庫存，異動紀錄的「調整前」才會是最新數字
    _items = await loadItems();
    const items = countItems().filter(i => _cur.counts[i.id] !== undefined).map(i => {
      const d = Math.round((_cur.counts[i.id] - i.stock) * 10000) / 10000;
      return { id: i.id, name: i.name, unit: i.unit, system: i.stock, counted: _cur.counts[i.id], first: !i.counted, diff: Math.abs(d) < 0.0001 ? 0 : d };
    });
    const batch = writeBatch(db);
    const countRef = doc(collection(db, 'stockCounts'));
    batch.set(countRef, {
      date: todayStr(), kitchen: KITCHEN, type: _cur.type, slot: _cur.slot || '', title: countTitle(_cur),
      by: _ud.name, at: serverTimestamp(), total: items.length, items
    });
    items.forEach(r => {
      batch.update(doc(db, 'stockItems', r.id), r.diff !== 0
        ? { [kf('stock')]: r.counted, [kf('lastCount')]: serverTimestamp() }
        : { [kf('lastCount')]: serverTimestamp() });
      if (r.diff === 0) return;
      batch.set(doc(collection(db, 'stockMoves')), {
        itemId: r.id, itemName: r.name, unit: r.unit, type: r.first ? '首次建檔' : '盤點調整',
        qty: r.diff, before: r.system, after: r.counted, note: '',
        countId: countRef.id, kitchen: KITCHEN, by: _ud.name, at: serverTimestamp()
      });
    });
    await batch.commit();
    items.forEach(r => { const it = _items.find(i => i.id === r.id); if (it) { it.stock = r.counted; it.counted = true; } });
    clearDraft();
    renderDone(items.length);
    show('vDone');
    if (_cur.slot === '晚上' || _cur.type === '食材') showDoneDiff(countRef.id);
  } catch (e) {
    showToast('儲存失敗，請檢查網路後重試', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '儲存盤點';
  }
};

// ── 4. 完成 ──
async function showDoneDiff(id) {
  try {
    _recent = await loadRecent();
    await loadDiffs();
    const df = _diffs[id];
    if (!df?.rows) return;
    const box = df.alerts.length
      ? `<div class="inv-diff"><h3>⚠️ 有 ${df.alerts.length} 項跟應該剩的差比較多</h3>${df.alerts.map(z =>
          `<div><b>${escHtml(z.it.label)}</b>：盤到 ${escHtml(qtyText(z.it, z.x.counted))}，應該剩 ${escHtml(qtyText(z.it, z.expect))}（<span class="dd-bad">${escHtml(diffText(z.it, z.d))}</span>）<span class="det-why">${escHtml(whyText(z))}</span></div>`).join('')}
          <div class="det-why" style="margin-top:6px;">先確認有沒有盤錯；盤錯可以在首頁「最近盤點」點進去修改數量。${escHtml(DIFF_NOTE)}</div></div>`
      : '<div class="inv-diff ok"><h3>✓ 數量都跟應該剩的差不多</h3><div class="det-why">照生產單、叫貨單和店面出貨推算，沒有明顯短少。</div></div>';
    document.getElementById('doneList').insertAdjacentHTML('afterbegin', box);
  } catch (e) {}
}
function renderDone(n) {
  const now = new Date();
  const hm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  let took = '';
  if (_cur.startedAt) {
    const sec = Math.max(0, Math.round((Date.now() - _cur.startedAt) / 1000));
    took = ` · 用時 ${sec >= 60 ? Math.floor(sec / 60) + ' 分 ' : ''}${sec % 60} 秒`;
  }
  document.getElementById('doneMeta').textContent = `${countTitle(_cur)} · ${hm} · ${_ud.name}${took}`;
  _copyHeader = `${now.getMonth() + 1}/${now.getDate()} ${countTitle(_cur)}`;
  document.getElementById('doneList').innerHTML = stockCard('目前庫存', `已更新 ${n} 個品項`);
}
</script>
