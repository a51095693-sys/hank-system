<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>央廚盤點 - 品項庫存</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<link rel="stylesheet" href="style.css?v=20261009a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
#itemTable td:not(:first-child){white-space:nowrap}
#itemTable tr.kind-row td{background:var(--surface2);font-weight:800;font-size:13px;color:var(--text1);padding:8px 12px}
#itemTable tr.kind-row:hover td{background:var(--surface2)}
@media(max-width:1100px){
  #itemTable tr.kind-row{border:none!important;background:none!important;padding:6px 0 0!important;margin-bottom:4px}
  #itemTable tr.kind-row td{display:block;background:none;padding:0;border:none}
  #itemTable tr.kind-row td::before{display:none}
}
/* 電腦視窗較窄（769–1100px）時品項改成兩欄卡片，按鈕不會被擠到畫面外 */
@media(min-width:769px) and (max-width:1100px){
  .table-wrap:has(#itemTable) table,.table-wrap:has(#itemTable) thead,#itemTable,#itemTable tr{display:block}
  .table-wrap:has(#itemTable) thead{display:none}
  #itemTable{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #itemTable tr{border:1px solid var(--border);border-radius:12px;padding:6px 14px 12px;background:#fff}
  #itemTable tr:hover td{background:none}
  #itemTable td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:none;border-top:1px solid var(--surface2);padding:7px 0;white-space:normal}
  #itemTable td:first-child{border-top:none;font-size:15px}
  #itemTable td::before{content:attr(data-label);font-weight:700;font-size:11px;color:var(--text2);flex-shrink:0}
  #itemTable td:first-child::before{display:none}
  #itemTable td:not([data-label]){display:inline-flex;border-top:none;padding:8px 8px 0 0}
  #itemTable tr:has(td[colspan]){grid-column:1/-1}
  #itemTable td[colspan]{display:block}
}
</style>
</head>
<body>
<div class="mob-header">
  <button class="mob-menu-btn" onclick="toggleMenu()">☰</button>
  <span class="mob-title">🗃️ 品項庫存</span>
  <span></span>
</div>
<div class="mob-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><h2>📦 央廚盤點</h2><p>庫存管理</p></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-user" id="sb-user-area"><div class="uname" style="color:rgba(255,255,255,.4);font-size:12px;">載入中…</div></div>
  </aside>
  <main class="main">
    <div class="page-title">🗃️ 品項庫存</div>
    <p style="font-size:13px;color:var(--text3);margin-top:-12px;margin-bottom:16px;">管理成品。配方請到「🧪 配方設定」，要叫貨的食材請到「🥬 食材與廠商」。</p>

    <div class="stat-grid">
      <div class="card" style="margin-bottom:0;"><div style="font-size:28px;font-weight:800;" id="stTotal">-</div><div style="font-size:12px;color:var(--text2);">品項數</div></div>
      <div class="card" style="margin-bottom:0;"><div style="font-size:28px;font-weight:800;color:var(--danger);" id="stLow">-</div><div style="font-size:12px;color:var(--text2);">低於安全庫存</div></div>
      <div class="card" style="margin-bottom:0;"><div style="font-size:16px;font-weight:800;padding-top:8px;" id="stLastCount">-</div><div style="font-size:12px;color:var(--text2);">最近盤點</div></div>
    </div>

    <div class="card">
      <div class="flex gap-2 flex-wrap items-center" style="margin-bottom:12px;">
        <input type="search" autocomplete="off" name="stock-search" class="form-control mob-tool-search" id="searchInput" placeholder="🔍 搜尋品名、規格…" style="width:auto;min-width:160px;" oninput="renderTable()">
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--danger);cursor:pointer;">
          <input type="checkbox" id="filterLow" onchange="renderTable()" style="cursor:pointer;">只看庫存不足
        </label>
        <span style="flex:1;"></span>
        <button class="btn btn-outline btn-sm" onclick="openMoves()">📜 庫存紀錄</button>
        <button class="btn btn-primary btn-sm" id="addItemBtn" onclick="openItem()">＋ 新增品項</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>品名</th><th>規格</th><th>安全庫存</th><th>目前庫存</th><th></th><th></th></tr></thead>
          <tbody id="itemTable"><tr><td colspan="6" class="text-muted text-center" style="padding:24px;">載入中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<!-- 新增 / 編輯品項 -->
<div class="modal-bg" id="itemModal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-title" id="itemModalTitle">＋ 新增品項</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div style="grid-column:1/-1;"><label class="form-label">品名 *</label><input type="text" class="form-control" id="iName" placeholder="例如：雞肉"></div>
      <div style="grid-column:1/-1;"><label class="form-label">種類</label>
        <div class="flex gap-2" id="iKinds"></div>
        <div style="font-size:12px;color:var(--text2);margin-top:6px;" id="iKindHint"></div>
      </div>
      <div style="grid-column:1/-1;"><label class="form-label">廠商（外購的成品才填）</label><input type="text" class="form-control" id="iSupplier" list="supList" placeholder="央廚自己做的不用填" autocomplete="off"><datalist id="supList"></datalist>
        <div style="font-size:12px;color:var(--text2);margin-top:6px;">有填廠商、又沒有配方的成品，叫貨計算會算成要跟廠商叫貨。</div></div>
      <label style="grid-column:1/-1;display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;background:var(--surface2);border-radius:8px;padding:10px 12px;">
        <input type="checkbox" id="iInternal" style="margin-top:3px;cursor:pointer;">
        <span><strong>內部使用</strong><br><span style="color:var(--text2);">只在盤點時出現，不出現在叫貨計算，也不需要設定配方（例：煮雞產出的雞油）</span></span>
      </label>
      <div style="grid-column:1/-1;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;">
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
          <input type="checkbox" id="iByproduct" style="margin-top:3px;cursor:pointer;" onchange="document.getElementById('iByWrap').classList.toggle('hidden', !this.checked)">
          <span><strong>副產品</strong><br><span style="color:var(--text2);">煮其他東西時順便產出（例：煮雞撈的雞湯），不需要配方；低於安全庫存時，盤點首頁會提醒撈取</span></span>
        </label>
        <div id="iByWrap" class="hidden flex gap-2 items-center" style="margin-top:8px;">
          <span style="white-space:nowrap;">提醒文字：</span><input type="text" class="form-control" id="iByproductOf" placeholder="例如：煮雞時撈取">
        </div>
      </div>
      <div><label class="form-label">單位 *</label><input type="text" class="form-control" id="iUnit" placeholder="盤、包、鍋…" oninput="document.getElementById('iCattyUnit').textContent = this.value.trim() || '單位'"></div>
      <div><label class="form-label">規格</label><input type="text" class="form-control" id="iSpec" placeholder="例如：10份／盤"></div>
      <div style="grid-column:1/-1;"><label class="form-label">台斤換算（選填，配方要用台斤／兩時才需要）</label>
        <div class="flex gap-2 items-center"><span style="font-size:14px;white-space:nowrap;">1 <span id="iCattyUnit">單位</span> ＝</span>
          <input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="iCatty" placeholder="例如：18" style="width:120px;">
          <span style="font-size:14px;">台斤</span></div></div>
      <div><label class="form-label">安全庫存</label><input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="iSafety" placeholder="低於此數提醒"></div>
      <div id="iStockWrap"><label class="form-label">期初庫存</label><input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="iStock" placeholder="0"></div>
      <div id="iStockHint" class="hidden" style="grid-column:1/-1;font-size:12px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:8px 10px;"></div>
    </div>

    <div id="iErr" class="hidden" role="alert" style="font-size:13px;color:var(--danger);background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:8px 10px;margin:-6px 0 12px;"></div>
    <div class="flex gap-2">
      <button class="btn btn-primary w-full" id="itemSaveBtn" onclick="saveItem()">儲存</button>
      <button class="btn btn-outline" onclick="closeModal('itemModal')">取消</button>
    </div>
    <button type="button" class="del-link hidden" id="iDelBtn" onclick="closeModal('itemModal'); openDel(document.getElementById('iId').value)">🗑 刪除這個品項</button>
    <input type="hidden" id="iId">
  </div>
</div>

<!-- 庫存異動 -->
<div class="modal-bg" id="moveModal">
  <div class="modal" style="max-width:380px;">
    <div class="modal-title">🔁 庫存異動：<span id="mvName"></span></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">目前庫存 <strong id="mvNow"></strong></p>
    <div style="margin-bottom:12px;">
      <label class="form-label">異動類型</label>
      <div class="flex gap-2 flex-wrap" id="mvTypes"></div>
    </div>
    <div style="margin-bottom:12px;">
      <label class="form-label" id="mvQtyLabel">數量 *</label>
      <div class="flex gap-2 items-center">
        <input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="mvQty" placeholder="輸入數量" style="font-size:18px;">
        <span id="mvUnit" style="font-size:14px;color:var(--text2);white-space:nowrap;"></span>
        <span id="mvSubWrap" class="flex gap-2 items-center hidden">
          <span style="color:var(--text2);">＋</span>
          <input type="number" min="0" step="any" inputmode="decimal" class="form-control" id="mvSub" placeholder="0" style="font-size:18px;width:90px;">
          <span id="mvSubUnit" style="font-size:14px;color:var(--text2);white-space:nowrap;"></span>
        </span>
      </div>
    </div>
    <div style="margin-bottom:16px;">
      <label class="form-label">備註</label>
      <input type="text" class="form-control" id="mvNote" placeholder="例如：出貨給心惦">
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary w-full" id="mvSaveBtn" onclick="saveMove()">登記</button>
      <button class="btn btn-outline" style="white-space:nowrap;" onclick="closeModal('moveModal')">取消</button>
    </div>
    <input type="hidden" id="mvId">
  </div>
</div>

<!-- 異動紀錄 -->
<div class="modal-bg" id="movesModal">
  <div class="modal" style="width:640px;">
    <div class="modal-title">📜 最近 100 筆庫存異動</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>時間</th><th>品名</th><th>類型</th><th>數量</th><th>異動後</th><th>人員</th><th>備註</th></tr></thead>
        <tbody id="movesTable"></tbody>
      </table>
    </div>
    <div class="flex gap-2 mt-4"><button class="btn btn-outline w-full" onclick="closeModal('movesModal')">關閉</button></div>
  </div>
</div>

<!-- 確認刪除 -->
<div class="modal-bg" id="delModal">
  <div class="modal" style="max-width:360px;">
    <div class="modal-title" style="color:var(--danger);">⚠️ 確認刪除</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:20px;">確定要刪除品項 <strong id="delName"></strong> 嗎？過去的盤點與異動紀錄會保留。</p>
    <div class="flex gap-2">
      <button class="btn btn-danger w-full" id="delConfirmBtn" onclick="confirmDelete()">確認刪除</button>
      <button class="btn btn-outline" onclick="closeModal('delModal')">取消</button>
    </div>
    <input type="hidden" id="delId">
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, query, orderBy, limit, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { getUserData, showToast, renderSidebar, loadStockItems, fmtQty, escHtml, qtyText, KINDS, loadSuppliers, recipeAmtText } from "./app.js?v=20261009a";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, 'default');

window.toggleMenu = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); };
window.doSignOut = async () => { sessionStorage.clear(); await signOut(auth); window.location.href = 'index.html'; };
window.closeModal = (id) => document.getElementById(id).classList.remove('open');
['itemModal','moveModal','movesModal','delModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) closeModal(id); });
});

// NK 新廚平台上的現有商品，品項為空時可一鍵匯入
const PRESET_ITEMS = [
  { name: '雞肉', category: '肉品', unit: '盤', spec: '10份／盤' },
  { name: '滷肉', category: '肉品', unit: '包', spec: '' },
  { name: '好吃醬', category: '醬料', unit: '鍋', spec: '' },
  { name: '雞湯', category: '醬料', unit: '包', spec: '' },
  { name: '辣椒', category: '醬料', unit: '鍋', spec: '' },
  { name: '油蔥酥', category: '醬料', unit: '罐', spec: '' },
  { name: '貢丸', category: '火鍋料', unit: '包', spec: '' },
  { name: '魚丸', category: '火鍋料', unit: '包', spec: '' }
];

const MOVE_TYPES = [
  { key: '生產入庫', sign: 1 }, { key: '進貨', sign: 1 },
  { key: '出貨', sign: -1 }, { key: '報廢', sign: -1 }, { key: '其他扣除', sign: -1 },
  { key: '校正為', sign: 0 }
];

let _ud = null;
let _items = [];

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  _ud = await getUserData(db, user);
  if (_ud.role !== 'admin' && _ud.role !== 'manager') { window.location.href = 'inventory.html'; return; }
  renderSidebar(_ud, 'stock.html', auth);
  loadAll();
});

async function loadAll() {
  try {
    _items = await loadStockItems(db);
  } catch (e) {
    document.getElementById('itemTable').innerHTML = '<tr><td colspan="6" class="text-muted text-center" style="padding:24px;">載入失敗，請重新整理</td></tr>';
    return;
  }
  renderTable();
  try {
    const snap = await getDocs(query(collection(db, 'stockCounts'), orderBy('at', 'desc'), limit(1)));
    const last = snap.docs[0]?.data();
    document.getElementById('stLastCount').textContent = last
      ? `${last.date}・${last.by}` : '尚未盤點';
  } catch (e) { document.getElementById('stLastCount').textContent = '-'; }
}

const isLow = (it) => it.safety > 0 && it.stock < it.safety;

window.renderTable = () => {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const lowOnly = document.getElementById('filterLow').checked;
  const own = _items.filter(it => it.kind !== '食材');
  document.getElementById('stTotal').textContent = own.length;
  document.getElementById('stLow').textContent = own.filter(isLow).length;

  const tbody = document.getElementById('itemTable');
  if (!_items.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center" style="padding:28px;">
      <div class="text-muted" style="margin-bottom:12px;">尚無品項</div>
      <button class="btn btn-primary" id="presetBtn" onclick="importPreset()">一鍵匯入 NK 商品（雞肉、好吃醬等 8 項）</button>
      <div class="text-muted" style="font-size:12px;margin-top:8px;">或點右上「新增品項」自行建立</div>
    </td></tr>`;
    return;
  }
  const rows = _items.filter(it => it.kind !== '食材' &&
    (!lowOnly || isLow(it)) &&
    (!kw || `${it.name} ${it.spec}`.toLowerCase().includes(kw))
  );
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center" style="padding:24px;">沒有符合條件的品項</td></tr>';
    return;
  }
  tbody.innerHTML = KINDS.filter(k => k !== '食材').map(k => {
    const group = rows.filter(it => it.kind === k);
    if (!group.length) return '';
    return `<tr class="kind-row"><td colspan="6">${k}（${group.length}）</td></tr>` + group.map(rowHtml).join('');
  }).join('');
};

const nameOf = (id) => _items.find(x => x.id === id);
function recipeText(it) {
  return it.recipe.map(r => {
    if (!r.id) return `${r.name} ${recipeAmtText(r)}`;
    const c = nameOf(r.id);
    return c ? `${c.label} ${recipeAmtText(r, c)}` : '';
  }).filter(Boolean).join('、');
}

function rowHtml(it) {
  const rc = recipeText(it);
  const sub = it.byproduct ? `<div style="font-size:11px;color:var(--text2);margin-top:2px;">副產品${it.byproductOf ? '：' + escHtml(it.byproductOf) : ''}</div>`
    : it.internal ? '<div style="font-size:11px;color:var(--text2);margin-top:2px;">內部使用</div>'
    : rc ? `<div style="font-size:11px;color:var(--text2);margin-top:2px;white-space:normal;">配方：做 ${escHtml(qtyText(it, it.yield))} 用 ${escHtml(rc)}</div>`
    : it.supplier ? `<div style="font-size:11px;color:var(--text2);margin-top:2px;">外購：${escHtml(it.supplier)}</div>`
    : '<div style="font-size:11px;margin-top:2px;"><a href="recipe.html" style="color:var(--danger);">尚未設定配方 →</a></div>';
  return `<tr>
    <td data-label="品名"><div style="font-weight:700;">${escHtml(it.name)}</div>${sub}</td>
    <td data-label="規格" style="font-size:12px;color:var(--text2);">${escHtml(it.spec) || '-'}</td>
    <td data-label="安全庫存" style="color:var(--text2);">${it.safety > 0 ? escHtml(qtyText(it, it.safety)) : '-'}</td>
    <td data-label="目前庫存" style="font-weight:700;${isLow(it) ? 'color:var(--danger);' : ''}">${escHtml(qtyText(it, it.stock))}${isLow(it) ? ' ⚠️' : ''}</td>
    <td><button class="btn btn-sm btn-primary" onclick="openMove('${it.id}')">± 調整庫存</button></td>
    <td><div class="flex gap-2">
      <button class="btn btn-sm btn-outline" onclick="openItem('${it.id}')">編輯</button>
    </div></td>
  </tr>`;
}

window.importPreset = async () => {
  const btn = document.getElementById('presetBtn');
  btn.disabled = true; btn.textContent = '匯入中…';
  try {
    const batch = writeBatch(db);
    PRESET_ITEMS.forEach((p, i) => {
      batch.set(doc(collection(db, 'stockItems')), {
        ...p, kind: '成品', stock: 0, safety: 0, sort: i, createdAt: serverTimestamp()
      });
    });
    await batch.commit();
    showToast('已匯入 8 個品項，請記得設定安全庫存', 'success');
    loadAll();
  } catch (e) {
    showToast('匯入失敗，請重試', 'error');
    btn.disabled = false; btn.textContent = '一鍵匯入 NK 商品（雞肉、好吃醬等 8 項）';
  }
};

const KIND_HINT = {
  '成品': '店面會叫貨的品項，叫貨計算時輸入叫貨量。',
  '食材': '改成食材後，這個品項會移到「🥬 食材與廠商」頁管理。'
};
let _kind = '成品';
let _editId = '';

function renderKinds() {
  document.getElementById('iKinds').innerHTML = KINDS.map(k =>
    `<button type="button" class="btn btn-sm ${k === _kind ? 'btn-primary' : 'btn-outline'}" onclick="pickKind('${k}')">${k}</button>`).join('');
  document.getElementById('iKindHint').textContent = KIND_HINT[_kind];
}
window.pickKind = (k) => { _kind = k; renderKinds(); };



window.openItem = (id) => {
  const it = id ? _items.find(x => x.id === id) : null;
  _editId = it ? it.id : '';
  _kind = it ? it.kind : '成品';
  renderKinds();
  document.getElementById('iErr').classList.add('hidden');
  document.getElementById('iSupplier').value = it ? it.supplier : '';
  document.getElementById('iInternal').checked = it ? it.internal : false;
  document.getElementById('iByproduct').checked = it ? it.byproduct : false;
  document.getElementById('iByproductOf').value = it ? it.byproductOf : '';
  document.getElementById('iByWrap').classList.toggle('hidden', !(it && it.byproduct));
  document.getElementById('iCatty').value = it && it.catty > 0 ? it.catty : '';
  document.getElementById('iCattyUnit').textContent = it ? it.unit : '單位';
  loadSuppliers(db, _items).then(list => {
    document.getElementById('supList').innerHTML = list.map(sp => `<option value="${escHtml(sp.name)}"></option>`).join('');
  }).catch(() => {});
  document.getElementById('itemModalTitle').textContent = it ? '✏️ 編輯品項' : '＋ 新增品項';
  document.getElementById('iId').value = it ? it.id : '';
  document.getElementById('iDelBtn').classList.toggle('hidden', !it);
  document.getElementById('iName').value = it ? it.name : '';
  document.getElementById('iUnit').value = it ? it.unit : '';
  document.getElementById('iSpec').value = it ? it.spec : '';
  document.getElementById('iSafety').value = it && it.safety > 0 ? it.safety : '';
  document.getElementById('iStock').value = '';
  // 已建立的品項只能透過「異動」或「盤點」改庫存，保留紀錄
  document.getElementById('iStockWrap').classList.toggle('hidden', !!it);
  document.getElementById('iStockHint').classList.toggle('hidden', !it);
  if (it) document.getElementById('iStockHint').textContent = `目前庫存 ${qtyText(it, it.stock)}。要修改庫存，請關閉後按該品項的「± 調整庫存」→「＝ 校正為」。`;
  document.getElementById('itemModal').classList.add('open');
};

window.saveItem = async () => {
  const id = document.getElementById('iId').value;
  const name = document.getElementById('iName').value.trim();
  const unit = document.getElementById('iUnit').value.trim();
  if (!name) { showToast('請輸入品名', 'error'); return; }
  if (!unit) { showToast('請輸入單位', 'error'); return; }
  const supplier = document.getElementById('iSupplier').value.trim();
  // 不同廠商可以有同名品項；同一家廠商內（或都沒有廠商）不能重複
  const dup = _items.some(x => x.id !== id && x.name === name && x.supplier === supplier);
  const errEl = document.getElementById('iErr');
  errEl.textContent = dup ? `已經有「${name}」${supplier ? `（${supplier}）` : ''}了，請換一個名稱` : '';
  errEl.classList.toggle('hidden', !dup);
  if (dup) return;
  // 配方在「配方設定」頁編輯；改成食材時清掉配方（食材是買來的）
  const data = {
    name, unit, kind: _kind, supplier, internal: document.getElementById('iInternal').checked,
    byproduct: document.getElementById('iByproduct').checked,
    byproductOf: document.getElementById('iByproductOf').value.trim(),
    catty: Math.max(0, parseFloat(document.getElementById('iCatty').value) || 0), ...(_kind === '食材' ? { recipe: [] } : {}),
    spec: document.getElementById('iSpec').value.trim(),
    safety: Math.max(0, parseFloat(document.getElementById('iSafety').value) || 0)
  };
  const btn = document.getElementById('itemSaveBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    if (id) {
      await updateDoc(doc(db, 'stockItems', id), data);
      showToast('品項已更新', 'success');
    } else {
      const stock = Math.max(0, parseFloat(document.getElementById('iStock').value) || 0);
      await addDoc(collection(db, 'stockItems'), { recipe: [], ...data, category: '', stock, sort: _items.length, createdAt: serverTimestamp() });
      showToast(`品項「${name}」已新增`, 'success');
    }
    closeModal('itemModal');
    loadAll();
  } catch (e) {
    showToast('儲存失敗，請重試', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '儲存';
  }
};

let _mvType = MOVE_TYPES[0].key;
function renderMoveTypes() {
  document.getElementById('mvTypes').innerHTML = MOVE_TYPES.map(t =>
    `<button type="button" class="btn btn-sm ${t.key === _mvType ? 'btn-primary' : 'btn-outline'}" onclick="pickMoveType('${t.key}')">${t.sign > 0 ? '＋' : t.sign < 0 ? '－' : '＝'} ${t.key}</button>`
  ).join('');
  // 「校正為」輸入的是正確的庫存數量，不是加減量
  const fix = _mvType === '校正為';
  document.getElementById('mvQtyLabel').textContent = fix ? '正確的庫存數量 *' : '數量 *';
  document.getElementById('mvQty').placeholder = fix ? '輸入實際應有的數量' : '輸入數量';
}
window.pickMoveType = (k) => { _mvType = k; renderMoveTypes(); };

// 雙單位品項（例：7包／箱）顯示「□ 箱 ＋ □ 包」兩格，其餘只有一格
function setMoveInputs(it) {
  document.getElementById('mvUnit').textContent = it.unit;
  document.getElementById('mvSub').value = '';
  document.getElementById('mvSubUnit').textContent = it.sub || '';
  document.getElementById('mvSubWrap').classList.toggle('hidden', !it.per);
}

window.openMove = (id) => {
  const it = _items.find(x => x.id === id);
  if (!it) return;
  _mvType = MOVE_TYPES[0].key;
  renderMoveTypes();
  document.getElementById('mvId').value = id;
  document.getElementById('mvName').textContent = it.name;
  document.getElementById('mvNow').textContent = qtyText(it, it.stock);
  setMoveInputs(it);
  document.getElementById('mvQty').value = '';
  document.getElementById('mvNote').value = '';
  document.getElementById('moveModal').classList.add('open');
};

window.saveMove = async () => {
  const it = _items.find(x => x.id === document.getElementById('mvId').value);
  const bigVal = document.getElementById('mvQty').value, subVal = document.getElementById('mvSub').value;
  // 雙單位品項：大單位＋小單位合併成大單位數量（例：1 箱 3 包、每箱 7 包 → 1.428… 箱）
  const input = it && it.per && (bigVal !== '' || subVal !== '')
    ? (parseFloat(bigVal) || 0) + (parseFloat(subVal) || 0) / it.per
    : parseFloat(bigVal);
  if (!it) return;
  const fix = _mvType === '校正為';
  if (fix ? !(input >= 0) : !(input > 0)) { showToast(fix ? '請輸入 0 以上的數量' : '請輸入大於 0 的數量', 'error'); return; }
  const after = fix ? input : Math.round((it.stock + MOVE_TYPES.find(t => t.key === _mvType).sign * input) * 1000) / 1000;
  if (after < 0) { showToast(`庫存不足，目前只有 ${fmtQty(it.stock)} ${it.unit}`, 'error'); return; }
  const delta = Math.round((after - it.stock) * 1000) / 1000;
  if (delta === 0) { showToast('數量與目前庫存相同，不需要調整', 'error'); return; }
  const sign = delta > 0 ? 1 : -1;
  const qty = Math.abs(delta);
  const btn = document.getElementById('mvSaveBtn');
  btn.disabled = true; btn.textContent = '登記中…';
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, 'stockItems', it.id), { stock: after });
    batch.set(doc(collection(db, 'stockMoves')), {
      itemId: it.id, itemName: it.name, unit: it.unit, type: _mvType,
      qty: sign * qty, before: it.stock, after,
      note: document.getElementById('mvNote').value.trim(),
      by: _ud.name, at: serverTimestamp()
    });
    await batch.commit();
    showToast(`${it.name} ${sign > 0 ? '+' : ''}${qtyText(it, sign * qty)}`, 'success');
    closeModal('moveModal');
    loadAll();
  } catch (e) {
    showToast('登記失敗，請重試', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '登記';
  }
};

window.openMoves = async () => {
  const tbody = document.getElementById('movesTable');
  tbody.innerHTML = '<tr><td colspan="7" class="text-muted text-center" style="padding:20px;">載入中…</td></tr>';
  document.getElementById('movesModal').classList.add('open');
  try {
    const snap = await getDocs(query(collection(db, 'stockMoves'), orderBy('at', 'desc'), limit(100)));
    if (snap.empty) { tbody.innerHTML = '<tr><td colspan="7" class="text-muted text-center" style="padding:20px;">尚無異動紀錄</td></tr>'; return; }
    // 依目前品項設定顯示箱＋包；已刪除的品項只用紀錄上的單位
    const unitOf = (m) => _items.find(i => i.id === m.itemId) || { unit: m.unit, per: 0 };
    tbody.innerHTML = snap.docs.map(d => {
      const m = d.data();
      const at = m.at?.toDate ? m.at.toDate().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '-';
      return `<tr>
        <td data-label="時間" style="font-size:12px;white-space:nowrap;">${at}</td>
        <td data-label="品名">${escHtml(m.itemName)}</td>
        <td data-label="類型">${escHtml(m.type)}</td>
        <td data-label="數量" style="font-weight:700;color:${m.qty < 0 ? 'var(--danger)' : 'var(--success)'};">${m.qty > 0 ? '+' : ''}${escHtml(qtyText(unitOf(m), m.qty))}</td>
        <td data-label="異動後">${escHtml(qtyText(unitOf(m), m.after))}</td>
        <td data-label="人員">${escHtml(m.by)}</td>
        <td data-label="備註" style="font-size:12px;color:var(--text2);">${escHtml(m.note) || '-'}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-muted text-center" style="padding:20px;">載入失敗</td></tr>';
  }
};

window.openDel = (id) => {
  const it = _items.find(x => x.id === id);
  if (!it) return;
  document.getElementById('delId').value = id;
  document.getElementById('delName').textContent = it.name;
  document.getElementById('delModal').classList.add('open');
};

window.confirmDelete = async () => {
  const btn = document.getElementById('delConfirmBtn');
  btn.disabled = true;
  try {
    const id = document.getElementById('delId').value;
    const batch = writeBatch(db);
    batch.delete(doc(db, 'stockItems', id));
    _items.filter(i => i.recipe.some(r => r.id === id)).forEach(i => {
      batch.update(doc(db, 'stockItems', i.id), { recipe: i.recipe.filter(r => r.id !== id) });
    });
    await batch.commit();
    showToast('品項已刪除', 'success');
    closeModal('delModal');
    loadAll();
  } catch (e) {
    showToast('刪除失敗', 'error');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
