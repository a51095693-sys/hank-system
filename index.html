<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>央廚盤點 - 登入</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:#F3F4F1;color:#17201B;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:380px}
.brand{text-align:center;margin-bottom:28px}
.brand-icon{width:64px;height:64px;background:#17201B;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
.brand h1{font-size:28px;font-weight:900;letter-spacing:1px;color:#17201B}
.brand p{font-size:14px;color:#56605A;margin-top:4px}
.card{background:#fff;border-radius:20px;padding:28px;border:1px solid #E1E4DF}
.fr{margin-bottom:16px}
.fr label{display:block;font-size:13px;color:#56605A;font-weight:700;margin-bottom:6px}
.fr input{width:100%;height:48px;padding:0 14px;border:1px solid #C9CFC9;border-radius:12px;font-size:16px;font-family:inherit;color:#17201B;background:#fff;transition:.15s}
.fr input:focus{outline:none;border-color:#1E6B47;box-shadow:0 0 0 3px rgba(30,107,71,.12)}
.btn-login{width:100%;height:56px;background:#3FBF7F;color:#0E2A1C;border:none;border-radius:14px;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s;margin-top:4px}
.btn-login:hover{filter:brightness(1.04)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.err{font-size:13px;color:#C2410C;margin-top:10px;text-align:center;min-height:16px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">📦</div>
    <h1>央廚盤點</h1>
    <p>央廚庫存盤點平台</p>
  </div>
  <div class="card">
    <div class="fr">
      <label>帳號</label>
      <input id="idNo" type="text" placeholder="輸入帳號" autocomplete="off">
    </div>
    <div class="fr">
      <label>密碼</label>
      <input id="pwd" type="password" placeholder="••••••">
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;">
      <input type="checkbox" id="rememberMe" style="width:auto;cursor:pointer;">
      <label for="rememberMe" style="font-size:12px;color:#64748B;font-weight:500;cursor:pointer;">記住帳號</label>
    </div>
    <div class="err" id="errMsg"></div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">登入</button>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { getUserData } from "./app.js?v=20261008d";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app, 'default');

onAuthStateChanged(auth, async u => {
  if (!u) return;
  const ud = await getUserData(db, u);
  window.location.href = 'inventory.html';
});

document.getElementById('idNo').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('pwd').focus(); });
document.getElementById('pwd').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

const savedIdNo = localStorage.getItem('rememberedIdNo');
if (savedIdNo) {
  document.getElementById('idNo').value = savedIdNo;
  document.getElementById('rememberMe').checked = true;
  document.getElementById('pwd').focus();
}

window.doLogin = async () => {
  const id = document.getElementById('idNo').value.trim();
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('errMsg');
  const btn = document.getElementById('loginBtn');
  if (!id || !pwd) { err.textContent = '請填寫帳號與密碼'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = '登入中…';
  try {
    await signInWithEmailAndPassword(auth, id + '@complaint.local', pwd);
    if (document.getElementById('rememberMe').checked) {
      localStorage.setItem('rememberedIdNo', id);
    } else {
      localStorage.removeItem('rememberedIdNo');
    }
  } catch(e) {
    btn.disabled = false; btn.textContent = '登入';
    err.textContent = '帳號或密碼錯誤';
  }
};
</script>
</body>
</html>
